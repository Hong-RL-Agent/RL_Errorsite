<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPoint | 스마트 병원 예약 시스템</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .doctor-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .doctor-card:hover { transform: scale(1.03) translateY(-10px); border-color: #3b82f6; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .nav-item { font-weight: 700; font-size: 0.875rem; color: #64748b; transition: color 0.2s; }
        .nav-item:hover { color: #3b82f6; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [doctors, setDoctors] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [dept, setDept] = useState('all');

            const fetchDoctors = async (d = 'all') => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/doctors?dept=${d}`);
                    const json = await res.json();
                    setDoctors(json.data);
                    if (json.bugId) console.log("Bug Triggered:", json.bugId);
                } catch (err) {
                    setError({ message: "데이터 로드 실패" });
                } finally {
                    setLoading(false);
                }
            };

            const checkVIP = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/appointments/check?room=vip');
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                    alert("VIP 병동 예약이 가능합니다.");
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            const showDetail = async (id) => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/doctors/${id}`);
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                    alert(`${json.data.name} 박사님 상세\n전공: ${json.data.specialty}\n일정: ${json.data.schedule.today}`);
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchDoctors(dept);
            }, [dept]);

            return (
                <div className="max-w-6xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-16 gap-8 bg-white p-6 rounded-[2.5rem] shadow-sm">
                        <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Med<span className="text-blue-600">Point</span></h1>
                        <nav className="flex gap-8">
                            <a href="#" className="nav-item">대시보드</a>
                            <a href="#" className="nav-item">진료예약</a>
                            <a href="#" className="nav-item">건강검진</a>
                            <a href="#" className="nav-item text-blue-600">전문의 찾기</a>
                        </nav>
                        <button 
                            onClick={checkVIP}
                            className="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold text-sm hover:bg-blue-600 transition-all shadow-lg shadow-blue-200"
                            data-bug-id="site054-bug03"
                        >
                            VIP 병동 예약 확인
                        </button>
                    </header>

                    {error && (
                        <div className="mb-10 p-6 bg-rose-50 border border-rose-100 rounded-3xl flex items-center justify-between" data-bug-id={error.bugId}>
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-rose-500 rounded-2xl flex items-center justify-center text-white text-2xl font-bold">!</div>
                                <div>
                                    <p className="font-extrabold text-slate-900">서버 응답 오류</p>
                                    <p className="text-xs text-slate-500 font-bold">{error.message} ({error.bugId || "ERR_UNKNOWN"})</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <section>
                        <div className="flex justify-between items-end mb-10">
                            <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight">의료진 리스트</h2>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setDept('all')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold ${dept === 'all' ? 'bg-blue-600 text-white' : 'bg-white text-slate-400'}`}
                                >
                                    전체
                                </button>
                                <button 
                                    onClick={() => setDept('internal')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold ${dept === 'internal' ? 'bg-blue-600 text-white' : 'bg-white text-slate-400'}`}
                                    data-bug-id="site054-bug01"
                                >
                                    내과 (BUG)
                                </button>
                            </div>
                        </div>

                        {loading ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 animate-pulse">
                                {[1, 2, 3].map(i => <div key={i} className="h-64 bg-slate-200 rounded-[2rem]"></div>)}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {doctors.map(doc => (
                                    <div 
                                        key={doc.id} 
                                        className="doctor-card p-8 cursor-pointer"
                                        onClick={() => showDetail(doc.id)}
                                        data-bug-id={doc.id === 'doc-505' ? "site054-bug02" : ""}
                                    >
                                        <div className="w-16 h-16 bg-blue-50 rounded-2xl mb-6 flex items-center justify-center text-blue-600 text-2xl font-bold italic">
                                            DR
                                        </div>
                                        <h3 className="text-xl font-extrabold text-slate-900 mb-1">{doc.name}</h3>
                                        <p className="text-blue-600 text-xs font-bold mb-4 uppercase tracking-widest">{doc.dept} • {doc.specialty}</p>
                                        <div className="pt-4 border-t border-slate-50 flex justify-between items-center">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase">Available Today</span>
                                            <span className="w-2 h-2 bg-emerald-500 rounded-full"></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </section>

                    <footer className="mt-40 pt-12 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center gap-6">
                        <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest">© 2026 MedPoint Healthcare Systems | SITE054</p>
                        <div className="flex gap-8 text-[10px] font-black text-slate-500 uppercase">
                            <a href="#" className="hover:text-blue-600">Privacy</a>
                            <a href="#" className="hover:text-blue-600">Terms</a>
                            <a href="#" className="hover:text-blue-600">API Docs</a>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
