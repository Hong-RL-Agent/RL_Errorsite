version: '3.8'

services:
  proxy:
    image: nginx:alpine
    ports:
      - "9041:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - zenith-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - zenith-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "9029"
    networks:
      - zenith-net

networks:
  zenith-net:
    driver: bridge
