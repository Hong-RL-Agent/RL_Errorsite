events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Use Docker's internal DNS resolver to prevent Nginx from crashing if backend is not immediately available
        resolver 127.0.0.11 valid=10s;

        location /api/ {
            set $backend "http://backend:9029";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            set $frontend "http://frontend:80";
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
