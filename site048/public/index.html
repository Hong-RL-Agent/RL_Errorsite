<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStay | 프리미엄 숙소 추천</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .card-hover:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [stays, setStays] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [search, setSearch] = useState("");
            const [priceFilter, setPriceFilter] = useState("");

            const fetchStays = async (location = "", maxPrice = "") => {
                setLoading(true);
                setError(null);
                try {
                    let url = `/api/accommodations?location=${location}&priceMax=${maxPrice}`;
                    const res = await fetch(url);
                    const json = await res.json();
                    
                    if (!res.ok) {
                        throw { message: json.message || "오류 발생", bugId: json.bugId };
                    }
                    setStays(json.data);
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            const fetchDetail = async (id) => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/accommodations/${id}`);
                    const json = await res.json();
                    if (!res.ok) {
                        throw { message: json.message || "상세 정보 로드 실패", bugId: json.bugId };
                    }
                    alert(`선택된 숙소: ${json.data.name}\n평점: ${json.data.rating}`);
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchStays();
            }, []);

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="glass sticky top-0 z-50 border-b border-slate-200 p-4">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-black text-blue-600 tracking-tighter">TravelStay</h1>
                            <nav className="space-x-6 text-sm font-bold text-slate-600">
                                <a href="#" className="hover:text-blue-500">홈</a>
                                <a href="#" className="hover:text-blue-500">인기숙소</a>
                                <a href="#" className="hover:text-blue-500">마이페이지</a>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 max-w-6xl mx-auto w-full p-6">
                        <section className="mb-10 bg-blue-600 rounded-3xl p-10 text-white shadow-xl shadow-blue-200">
                            <h2 className="text-3xl font-extrabold mb-6">어디로 떠나시나요?</h2>
                            <div className="flex flex-wrap gap-4 bg-white/10 p-4 rounded-2xl">
                                <input 
                                    type="text" 
                                    placeholder="지역 (예: Seoul, Antarctica)" 
                                    className="flex-1 bg-white text-slate-800 p-4 rounded-xl outline-none"
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                    data-bug-id="site048-bug03"
                                />
                                <select 
                                    className="bg-white text-slate-800 p-4 rounded-xl outline-none min-w-[150px]"
                                    value={priceFilter}
                                    onChange={(e) => setPriceFilter(e.target.value)}
                                    data-bug-id="site048-bug01"
                                >
                                    <option value="">가격 전체</option>
                                    <option value="100">$100 이하 (BUG)</option>
                                    <option value="200">$200 이하</option>
                                </select>
                                <button 
                                    onClick={() => fetchStays(search, priceFilter)}
                                    className="bg-slate-900 text-white px-8 py-4 rounded-xl font-bold hover:bg-black transition-all"
                                >
                                    검색하기
                                </button>
                            </div>
                        </section>

                        {loading && (
                            <div className="flex justify-center py-20">
                                <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
                            </div>
                        )}

                        {error && (
                            <div className="mb-8 p-6 bg-red-50 border border-red-200 rounded-2xl flex items-center gap-4 text-red-700 shadow-sm" data-bug-id={error.bugId}>
                                <span className="text-2xl">🚨</span>
                                <div>
                                    <p className="font-black">시스템 오류가 감지되었습니다.</p>
                                    <p className="text-sm opacity-80">{error.message} (Bug ID: {error.bugId || "Unknown"})</p>
                                </div>
                            </div>
                        )}

                        {!loading && !error && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {stays.map(stay => (
                                    <div 
                                        key={stay.id} 
                                        className="card-hover bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 cursor-pointer"
                                        onClick={() => fetchDetail(stay.id)}
                                        data-bug-id={stay.id === 'stay-999' ? "site048-bug02" : ""}
                                    >
                                        <div className="h-48 bg-slate-200 animate-pulse relative">
                                            <div className="absolute top-4 right-4 bg-white/90 px-3 py-1 rounded-full text-xs font-black text-blue-600">
                                                ★ {stay.rating}
                                            </div>
                                        </div>
                                        <div className="p-6">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="text-lg font-bold text-slate-800">{stay.name}</h3>
                                                <p className="text-xl font-black text-slate-900">${stay.price}</p>
                                            </div>
                                            <p className="text-slate-500 text-sm mb-4">📍 {stay.location}</p>
                                            <div className="flex gap-2">
                                                <span className="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded uppercase tracking-widest text-slate-400">Wi-Fi</span>
                                                <span className="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded uppercase tracking-widest text-slate-400">Kitchen</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {stays.length === 0 && !loading && (
                                    <div className="col-span-full py-20 text-center text-slate-400 font-bold">
                                        검색 결과가 없습니다.
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-white p-12 mt-20">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div>
                                <h2 className="text-xl font-black mb-2">TravelStay</h2>
                                <p className="text-slate-400 text-sm">© 2026 TravelStay Inc. site048</p>
                            </div>
                            <div className="flex gap-8 text-sm font-bold text-slate-400">
                                <a href="#" className="hover:text-white">이용약관</a>
                                <a href="#" className="hover:text-white">개인정보처리방침</a>
                                <a href="#" className="hover:text-white">고객센터</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
