server:
  port: ${ASTRO_FARM_PORT:9073}

spring:
  application:
    name: astro-farm-training
  datasource:
    url: jdbc:h2:mem:astrofarm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

training:
  cors:
    allowed-origins: ${TRAINING_CORS_ALLOWED_ORIGINS:*}
  rate-limit:
    enabled: ${TRAINING_RATE_LIMIT_ENABLED:false}

