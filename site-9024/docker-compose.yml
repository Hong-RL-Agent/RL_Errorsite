version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9024-nginx
    ports:
      - "9024:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: site-9024-backend
    ports:
      - "5005:8080"