version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9008-nginx
    ports:
      - "9008:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # [수정] html 안이 아니라 /data 라는 새로운 곳에 마운트합니다.
      - ./storage:/data/storage:ro