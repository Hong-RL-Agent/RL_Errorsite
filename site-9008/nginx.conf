events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # [핵심 함정] 비공개 폴더인데 외부 접근을 허용하고 목록까지 보여줌
        location /storage/ {
        # [수정] 아까 마운트한 /data/storage 경로를 바라보게 합니다.
        alias /data/storage/; 
        autoindex on;
        autoindex_exact_size off;
        }
    }
}