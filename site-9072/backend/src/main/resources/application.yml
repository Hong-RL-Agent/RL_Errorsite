server:
  port: ${SERVER_PORT:9072}

spring:
  application:
    name: climate-ai-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

climate-ai:
  public-origin: ${CLIMATE_AI_PUBLIC_ORIGIN:http://localhost:9072}
  profile: ${CLIMATE_AI_PROFILE:local-9072}

