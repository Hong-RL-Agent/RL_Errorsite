<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RL Error Sites</title>
    <style>
      :root {
        color: #172033;
        background: #f7f8fb;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      h2 {
        margin: 32px 0 12px;
        font-size: 20px;
      }

      p {
        margin: 0;
        color: #526070;
        line-height: 1.6;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
      }

      a {
        display: block;
        padding: 14px 16px;
        border: 1px solid #d9dee8;
        border-radius: 8px;
        background: #fff;
        color: #1d4ed8;
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        border-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RL Error Sites</h1>
      <p>이 배포본은 frontend-errorsite 기준 에러사이트를 GitHub Pages에서 확인하기 위한 정적 산출물입니다.</p>

      <section>
        <h2>frontend-errorsite</h2>
        <ul>
        <li><a href="./frontend-errorsite/site001/">site001</a></li>
        <li><a href="./frontend-errorsite/site002/">site002</a></li>

        </ul>
      </section>
    </main>
  </body>
</html>
