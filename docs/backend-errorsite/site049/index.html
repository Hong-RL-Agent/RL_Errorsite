<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthAudit | 엔터프라이즈 보안 감사</title>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .row-hover:hover { background-color: rgba(30, 41, 59, 0.5); }
    </style>
</head>
<body class="p-8">
    <div id="root"></div>  <script src="./pages-mock-api.js"></script>


    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [logs, setLogs] = useState([]);
            const [page, setPage] = useState(1);
            const [limit, setLimit] = useState(10);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);

            const fetchLogs = async (p = 1, l = 10) => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/audit/logs?page=${p}&limit=${l}`);
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                    setLogs(json.data);
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            const triggerAuthBug = async () => {
                setError(null);
                setSuccessMsg(null);
                try {
                    const res = await fetch('/api/auth/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: 'error-token' })
                    });
                    const json = await res.json();
                    // res.ok will be true because of Bug site049-bug03 (200 status code)
                    if (json.ok) {
                        setSuccessMsg("인증 성공!");
                    } else {
                        setError({ message: json.message, bugId: json.bugId });
                    }
                } catch (err) {
                    setError({ message: "Network Error" });
                }
            };

            const triggerParsingBug = () => {
                fetchLogs(1, "invalid_number");
            };

            useEffect(() => {
                fetchLogs(page, limit);
            }, [page, limit]);

            return (
                <div className="max-w-6xl mx-auto">
                    <header className="mb-12 border-b border-slate-800 pb-8 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-black text-white tracking-tighter">AuthAudit <span className="text-blue-500 text-sm">v2.4</span></h1>
                            <p className="text-slate-400 text-sm mt-1">Enterprise Security Log Monitoring</p>
                        </div>
                        <div className="flex gap-4">
                            <button 
                                onClick={triggerAuthBug}
                                className="bg-rose-500/10 text-rose-500 px-4 py-2 rounded-lg font-bold text-xs border border-rose-500/20 hover:bg-rose-500 hover:text-white transition-all"
                                data-bug-id="site049-bug03"
                            >
                                Trigger Auth Bug
                            </button>
                            <button 
                                onClick={triggerParsingBug}
                                className="bg-amber-500/10 text-amber-500 px-4 py-2 rounded-lg font-bold text-xs border border-amber-500/20 hover:bg-amber-500 hover:text-white transition-all"
                                data-bug-id="site049-bug02"
                            >
                                Trigger Parsing Bug
                            </button>
                        </div>
                    </header>

                    {error && (
                        <div className="mb-8 p-4 bg-rose-500/10 border border-rose-500/50 rounded-xl text-rose-400 flex items-center justify-between shadow-2xl shadow-rose-900/20" data-bug-id={error.bugId}>
                            <div className="flex items-center gap-3">
                                <span className="text-xl">⚠️</span>
                                <div>
                                    <p className="font-bold">시스템 경고</p>
                                    <p className="text-xs opacity-80">{error.message}</p>
                                </div>
                            </div>
                            {error.bugId && <span className="text-[10px] font-mono bg-rose-500/20 px-2 py-1 rounded">BUG_ID: {error.bugId}</span>}
                        </div>
                    )}

                    {successMsg && (
                        <div className="mb-8 p-4 bg-emerald-500/10 border border-emerald-500/50 rounded-xl text-emerald-400 font-bold flex items-center gap-3">
                            <span>✅</span> {successMsg}
                        </div>
                    )}

                    <div className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-slate-800 text-slate-400 uppercase text-[10px] font-black tracking-widest">
                                <tr>
                                    <th className="p-5">ID</th>
                                    <th className="p-5">Timestamp</th>
                                    <th className="p-5">Event</th>
                                    <th className="p-5">User</th>
                                    <th className="p-5">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {loading ? (
                                    <tr><td colSpan="5" className="p-20 text-center text-slate-500 animate-pulse font-bold">감사 로그를 스캔하는 중...</td></tr>
                                ) : (
                                    logs.map(log => (
                                        <tr key={log.id} className="row-hover transition-colors">
                                            <td className="p-5 font-bold text-blue-500 mono">{log.id}</td>
                                            <td className="p-5 text-slate-400 text-xs mono">{log.timestamp}</td>
                                            <td className="p-5">
                                                <span className="bg-slate-800 px-2 py-1 rounded text-[10px] font-black text-slate-300 border border-slate-700">
                                                    {log.event}
                                                </span>
                                            </td>
                                            <td className="p-5 font-medium text-slate-300">{log.user}</td>
                                            <td className="p-5">
                                                <span className={`px-2 py-1 rounded-full text-[10px] font-black ${log.status === 'SUCCESS' ? 'text-emerald-500 bg-emerald-500/10' : 'text-rose-500 bg-rose-500/10'}`}>
                                                    {log.status}
                                                </span>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                        
                        <div className="p-6 bg-slate-800/50 border-t border-slate-800 flex justify-between items-center">
                            <div className="text-xs text-slate-500 font-bold">
                                Total 50 Logs Found
                            </div>
                            <div className="flex gap-2">
                                {[1, 2, 3, 4, 5].map(p => (
                                    <button 
                                        key={p} 
                                        onClick={() => setPage(p)}
                                        className={`w-8 h-8 rounded-lg font-black text-xs transition-all ${page === p ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}
                                        data-bug-id={p === 2 ? "site049-bug01" : ""}
                                    >
                                        {p}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
