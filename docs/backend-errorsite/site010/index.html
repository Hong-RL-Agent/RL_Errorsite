<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet - site010</title>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f4f7f6; 
            color: #1a2e26;
        }

        .fintech-green { color: #004d40; }
        .fintech-green-bg { background: #004d40; }
        .neon-accent { color: #b2ff59; }
        .neon-accent-bg { background: #b2ff59; }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 77, 64, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .wallet-card {
            background: linear-gradient(135deg, #004d40 0%, #00695c 100%);
            color: white;
            box-shadow: 0 20px 40px rgba(0, 77, 64, 0.2);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .transaction-row {
            transition: all 0.2s ease;
        }
        .transaction-row:hover {
            transform: translateX(5px);
            background: #ffffff;
        }

        footer { border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <div id="root"></div>  <script src="./pages-mock-api.js"></script>


    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [balance, setBalance] = useState(0);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                try {
                    const [balRes, histRes] = await Promise.all([
                        fetch('/api/wallet/balance'),
                        fetch('/api/payment/history')
                    ]);
                    const balData = await balRes.json();
                    const histData = await histRes.json();
                    
                    if (balData.ok) setBalance(balData.balance);
                    if (histData.ok) setHistory(histData.data);
                } catch (err) {
                    setError("Failed to sync wallet data");
                } finally {
                    setLoading(false);
                }
            };

            const triggerBug01 = async () => {
                setError(null);
                try {
                    const res = await fetch('/api/wallet/balance?detail=full');
                    const data = await res.json();
                    if (!data.ok) setError(`System Error: ${data.message} (bug01)`);
                } catch (err) {
                    setError("Internal Server Error (bug01)");
                }
            };

            const triggerBug02 = async () => {
                setError(null);
                try {
                    const res = await fetch('/api/payment/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount: { value: 5000 }, description: "Type Error" }) // Sending object instead of number
                    });
                    const data = await res.json();
                    if (!data.ok) setError(`Validation Failed: ${data.message} (bug02)`);
                } catch (err) {
                    setError("Request Processing Error (bug02)");
                }
            };

            const triggerBug03 = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/payment/history?speed=slow');
                    const data = await res.json();
                    if (data.ok) setHistory(data.data);
                } catch (err) {
                    setError("API Response Timeout (bug03)");
                } finally {
                    setLoading(false);
                }
            };

            const processPayment = async (amount, desc) => {
                setError(null);
                try {
                    const res = await fetch('/api/payment/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount, description: desc })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        setNotification(`Paid ₩${amount.toLocaleString()}`);
                        setTimeout(() => setNotification(null), 3000);
                        fetchData();
                    }
                } catch (err) {
                    setError("Payment failed");
                }
            };

            if (loading && history.length === 0) return <div className="flex items-center justify-center h-screen fintech-green font-bold text-xl animate-pulse">Securing Ledger...</div>;

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <nav className="bg-white border-b border-gray-100 p-6 px-10 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 fintech-green-bg rounded-lg flex items-center justify-center text-white font-bold text-xs">DW</div>
                            <h1 className="text-xl font-bold tracking-tight fintech-green">DIGITAL WALLET</h1>
                        </div>
                        <div className="flex gap-8 text-sm font-semibold text-gray-500">
                            <a href="#" className="hover:text-teal-700">Dashboard</a>
                            <a href="#" className="hover:text-teal-700">Transactions</a>
                            <a href="#" className="hover:text-teal-700">Settings</a>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto p-10 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-10">
                        
                        {/* Sidebar: Balance & Bug Triggers */}
                        <div className="lg:col-span-5 space-y-8">
                            <div className="wallet-card rounded-[2.5rem] p-10 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-8 opacity-10 text-6xl">🏦</div>
                                <h2 className="text-sm font-bold opacity-60 uppercase tracking-widest mb-2">Total Balance</h2>
                                <div className="text-5xl font-bold mb-8">₩{balance.toLocaleString()}</div>
                                <button 
                                    onClick={() => processPayment(10000, "Normal Payment")}
                                    className="bg-white text-teal-900 px-6 py-3 rounded-2xl font-bold text-sm shadow-xl hover:bg-teal-50"
                                >
                                    Quick Pay ₩10,000
                                </button>
                            </div>

                            <section className="glass-card rounded-[2rem] p-8 space-y-4">
                                <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Debug Controls</h3>
                                <div className="grid grid-cols-1 gap-2">
                                    <button 
                                        data-bug-id="site010-bug01"
                                        onClick={triggerBug01}
                                        className="w-full py-3 bg-red-100 text-red-600 hover:bg-red-200 font-bold rounded-xl text-xs transition-all"
                                    >
                                        [BUG] Null Reference Test
                                    </button>
                                    <button 
                                        data-bug-id="site010-bug02"
                                        onClick={triggerBug02}
                                        className="w-full py-3 bg-red-100 text-red-600 hover:bg-red-200 font-bold rounded-xl text-xs transition-all"
                                    >
                                        [BUG] Type Parsing Test
                                    </button>
                                    <button 
                                        data-bug-id="site010-bug03"
                                        onClick={triggerBug03}
                                        className="w-full py-3 bg-red-100 text-red-600 hover:bg-red-200 font-bold rounded-xl text-xs transition-all"
                                    >
                                        [BUG] API Timeout Test
                                    </button>
                                </div>
                            </section>
                        </div>

                        {/* Content: History */}
                        <div className="lg:col-span-7 space-y-8">
                            {error && (
                                <div className="bg-red-600 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center animate-bounce">
                                    <span className="font-bold text-sm">{error}</span>
                                    <button onClick={() => setError(null)} className="opacity-60 hover:opacity-100">✕</button>
                                </div>
                            )}

                            <section className="glass-card rounded-[2.5rem] p-10">
                                <h3 className="text-xl font-bold mb-8">Recent Transactions</h3>
                                <div className="space-y-4">
                                    {history.slice().reverse().map(tx => (
                                        <div key={tx.id} className="transaction-row p-4 rounded-2xl flex justify-between items-center bg-gray-50/50">
                                            <div className="flex gap-4 items-center">
                                                <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-lg shadow-sm">
                                                    {tx.type === 'CHARGE' ? '📥' : '💸'}
                                                </div>
                                                <div>
                                                    <div className="font-bold text-sm">{tx.description}</div>
                                                    <div className="text-[10px] text-gray-400 font-bold uppercase">{new Date(tx.date).toLocaleTimeString()}</div>
                                                </div>
                                            </div>
                                            <div className={`font-bold ${tx.type === 'CHARGE' ? 'text-green-600' : 'text-gray-800'}`}>
                                                {tx.type === 'CHARGE' ? '+' : '-'} ₩{tx.amount.toLocaleString()}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-white py-12 px-10 text-center space-y-4">
                        <div className="text-xs text-gray-400 font-bold uppercase tracking-widest">© 2026 Digital Wallet Platform • site010</div>
                        <div className="flex justify-center gap-6 text-xs text-gray-300">
                            <a href="#">Privacy Policy</a>
                            <a href="#">Terms of Service</a>
                            <a href="#">Support</a>
                        </div>
                    </footer>

                    {/* Toast */}
                    {notification && (
                        <div className="fixed bottom-10 right-10 fintech-green-bg text-white p-6 px-10 rounded-2xl shadow-2xl font-bold animate-slide-in">
                            {notification}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
