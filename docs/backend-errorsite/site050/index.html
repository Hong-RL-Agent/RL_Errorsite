<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoHub | 실시간 암호화폐 시세</title>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ffffff; }
        .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .crypto-card { background: #111; border: 1px solid #222; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .crypto-card:hover { border-color: #3b82f6; transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3); }
        .gradient-text { background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="p-4 md:p-12">
    <div id="root"></div>  <script src="./pages-mock-api.js"></script>


    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [coins, setCoins] = useState([]);
            const [market, setMarket] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [refreshMode, setRefreshMode] = useState('normal');

            const fetchData = async (mode = 'normal') => {
                setLoading(true);
                setError(null);
                try {
                    const priceRes = await fetch(`/api/crypto/prices?refresh=${mode}`);
                    const summaryRes = await fetch(`/api/crypto/market-summary`);
                    
                    const priceJson = await priceRes.json();
                    const summaryJson = await summaryRes.json();

                    setCoins(priceJson.data);
                    setMarket(summaryJson);
                } catch (err) {
                    setError({ message: "데이터 연결 오류" });
                } finally {
                    setLoading(false);
                }
            };

            const showDetail = async (symbol) => {
                try {
                    const res = await fetch(`/api/crypto/detail/${symbol}`);
                    const json = await res.json();
                    if (json.ok) {
                        const detailStr = `[${json.data.symbol}] ${json.data.name}\nPrice: $${json.data.price}\n24h Change: ${json.data.change24h || "데이터 없음"}`;
                        alert(detailStr);
                    }
                } catch (e) {
                    alert("상세 정보를 가져올 수 없습니다.");
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            return (
                <div className="max-w-7xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-16">
                        <div>
                            <h1 className="font-heading text-5xl font-bold tracking-tighter mb-2 italic">Crypto<span className="gradient-text">Hub</span></h1>
                            <p className="text-zinc-500 font-medium">Real-time Terminal for Global Digital Assets</p>
                        </div>
                        <div className="flex gap-3">
                            <button 
                                onClick={() => { setRefreshMode('stale'); fetchData('stale'); }}
                                className="bg-zinc-800 text-zinc-300 px-6 py-3 rounded-2xl font-bold text-sm hover:bg-zinc-700 transition-all border border-zinc-700"
                                data-bug-id="site050-bug02"
                            >
                                Stale Refresh (BUG)
                            </button>
                            <button 
                                onClick={() => { setRefreshMode('normal'); fetchData('normal'); }}
                                className="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold text-sm hover:bg-blue-500 transition-all shadow-lg shadow-blue-500/20"
                            >
                                Refresh Feed
                            </button>
                        </div>
                    </header>

                    {market && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                            <div className="crypto-card p-8 rounded-[2rem]" data-bug-id="site050-bug01">
                                <p className="text-zinc-500 text-xs font-black uppercase tracking-widest mb-4">Total Market Cap</p>
                                <h3 className="text-3xl font-bold font-heading text-blue-400">${market.totalMarketCap.toLocaleString()}</h3>
                                <p className="text-[10px] text-zinc-600 mt-2 font-mono italic">Expected: ${market.actualDataSum.toLocaleString()}</p>
                            </div>
                            <div className="crypto-card p-8 rounded-[2rem]">
                                <p className="text-zinc-500 text-xs font-black uppercase tracking-widest mb-4">Active Assets</p>
                                <h3 className="text-3xl font-bold font-heading">2,481</h3>
                            </div>
                            <div className="crypto-card p-8 rounded-[2rem]">
                                <p className="text-zinc-500 text-xs font-black uppercase tracking-widest mb-4">Market Sentiment</p>
                                <h3 className="text-3xl font-bold font-heading text-emerald-400">GREED</h3>
                            </div>
                        </div>
                    )}

                    {loading ? (
                        <div className="py-40 text-center animate-pulse text-zinc-600 font-black tracking-tighter text-2xl uppercase">
                            Connecting to blockchain...
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {coins.map(coin => (
                                <div 
                                    key={coin.symbol} 
                                    className="crypto-card p-8 rounded-[2rem] cursor-pointer"
                                    onClick={() => showDetail(coin.symbol)}
                                    data-bug-id={coin.symbol === 'LUNA' ? "site050-bug03" : ""}
                                >
                                    <div className="flex justify-between items-start mb-6">
                                        <div className="w-12 h-12 bg-zinc-800 rounded-2xl flex items-center justify-center font-bold text-zinc-400">
                                            {coin.symbol[0]}
                                        </div>
                                        <span className={`text-xs font-bold px-3 py-1 rounded-full ${coin.change24h?.startsWith('+') ? 'text-emerald-500 bg-emerald-500/10' : 'text-rose-500 bg-rose-500/10'}`}>
                                            {coin.change24h || "FIELD_MISSING"}
                                        </span>
                                    </div>
                                    <h4 className="text-zinc-400 text-sm font-bold">{coin.name}</h4>
                                    <div className="flex items-baseline gap-2 mt-1">
                                        <h3 className="text-2xl font-bold font-heading">${coin.price.toLocaleString()}</h3>
                                        <span className="text-zinc-600 text-xs font-mono uppercase">{coin.symbol}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <footer className="mt-32 pt-12 border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center gap-6">
                        <p className="text-zinc-600 text-xs font-medium uppercase tracking-widest italic">© 2026 CryptoHub Terminal | SITE050</p>
                        <div className="flex gap-8 text-[10px] font-black text-zinc-700 uppercase tracking-[0.3em]">
                            <a href="#" className="hover:text-zinc-400">System Status</a>
                            <a href="#" className="hover:text-zinc-400">Privacy Policy</a>
                            <a href="#" className="hover:text-zinc-400">Audit Logs</a>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
