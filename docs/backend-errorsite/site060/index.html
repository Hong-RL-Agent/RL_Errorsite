<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandEstate | 프리미엄 부동산 매물 정보</title>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #1a1a1a; }
        .font-luxury { font-family: 'Playfair Display', serif; }
        .prop-card { background: white; border: 1px solid #eee; border-radius: 1rem; overflow: hidden; transition: all 0.4s; }
        .prop-card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px -12px rgba(0,0,0,0.08); border-color: #c5a059; }
        .btn-luxury { background: #1a1a1a; color: #c5a059; padding: 0.75rem 1.5rem; font-weight: 800; border-radius: 0.5rem; transition: all 0.3s; }
        .btn-luxury:hover { background: #c5a059; color: #1a1a1a; }
    </style>
</head>
<body class="p-4 md:p-12">
    <div id="root"></div>  <script src="./pages-mock-api.js"></script>


    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [filter, setFilter] = useState('all');

            const fetchProperties = async (f = 'all') => {
                setLoading(true);
                setError(null);
                try {
                    let url = '/api/properties';
                    if (f === 'rooms') url += '?minRooms=3';
                    
                    const res = await fetch(url);
                    const json = await res.json();
                    setProperties(json.data);
                } catch (err) {
                    setError({ message: "서버 연결에 실패했습니다." });
                } finally {
                    setLoading(false);
                }
            };

            const checkPremium = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/properties/premium');
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            const saveDraft = async () => {
                setError(null);
                try {
                    const res = await fetch('/api/properties/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ price: 1000000 }) // No title (trigger bug)
                    });
                    const json = await res.json();
                    if (!json.ok) {
                        setError({ message: json.message, bugId: json.bugId });
                    }
                } catch (e) {}
            };

            useEffect(() => {
                fetchProperties(filter);
            }, [filter]);

            return (
                <div className="max-w-6xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-20 gap-8">
                        <h1 className="font-luxury text-4xl tracking-tighter text-[#c5a059]">GRANDESTATE</h1>
                        <nav className="flex gap-10 text-xs font-black uppercase tracking-widest text-gray-400">
                            <button onClick={() => setFilter('all')} className={filter === 'all' ? 'text-black' : ''}>Buy</button>
                            <button onClick={() => setFilter('rooms')} className={filter === 'rooms' ? 'text-black' : ''} data-bug-id="site060-bug01">Rent (3+ Rooms)</button>
                            <button onClick={checkPremium} data-bug-id="site060-bug02">Premium</button>
                            <button onClick={saveDraft} className="text-[#c5a059]" data-bug-id="site060-bug03">Sell</button>
                        </nav>
                    </header>

                    {error && (
                        <div className="mb-12 p-8 bg-[#c5a059]/5 border border-[#c5a059]/20 rounded-2xl flex items-center justify-between" data-bug-id={error.bugId}>
                            <div className="flex items-center gap-6">
                                <span className="text-3xl">🏛️</span>
                                <div>
                                    <p className="font-luxury text-xl text-[#c5a059]">Operational Alert</p>
                                    <p className="text-xs text-gray-500 font-bold">{error.message} (ID: {error.bugId})</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {loading ? (
                        <div className="flex flex-col items-center py-24 gap-6">
                            <div className="w-16 h-1 bg-[#c5a059] animate-pulse"></div>
                            <p className="font-luxury italic text-gray-400">Curating selected properties...</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                            {properties.map(p => (
                                <div key={p.id} className="prop-card flex flex-col">
                                    <div className="aspect-video bg-gray-100 flex items-center justify-center text-[#c5a059] font-luxury text-2xl italic">
                                        PROPERTY IMAGE
                                    </div>
                                    <div className="p-8 flex-1 flex flex-col">
                                        <div className="flex justify-between items-center mb-6">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-gray-400">{p.type}</span>
                                            <span className="text-sm font-bold text-[#c5a059]">{p.rooms} Rooms</span>
                                        </div>
                                        <h3 className="font-luxury text-2xl mb-4">{p.title}</h3>
                                        <p className="text-2xl font-black mb-8">${p.price.toLocaleString()}</p>
                                        <button className="mt-auto btn-luxury text-xs tracking-widest">VIEW DETAILS</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <footer className="mt-40 pt-16 border-t border-gray-100 flex flex-col md:flex-row justify-between items-start gap-12">
                        <div className="max-w-xs">
                            <p className="font-luxury text-2xl text-[#c5a059] mb-6">GRANDESTATE</p>
                            <p className="text-gray-400 text-xs leading-relaxed">The global leader in luxury residential and commercial real estate services for over 50 years.</p>
                        </div>
                        <div className="flex flex-wrap gap-16">
                            <div className="flex flex-col gap-4">
                                <p className="text-[10px] font-black uppercase tracking-[0.2em] text-gray-300">Services</p>
                                <a href="#" className="text-xs font-bold text-gray-500 hover:text-black">Consultation</a>
                                <a href="#" className="text-xs font-bold text-gray-500 hover:text-black">Legal Support</a>
                                <a href="#" className="text-xs font-bold text-gray-500 hover:text-black">Valuation</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
