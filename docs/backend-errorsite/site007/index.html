<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Reward Commerce - site007</title>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>  <script src="./pages-mock-api.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f9e29d 50%, #d4af37 100%); }
        .serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>
    <div id="root"></div>  <script src="./pages-mock-api.js"></script>


    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [products, setProducts] = useState([]);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                try {
                    const [prodRes, userRes] = await Promise.all([
                        fetch('/api/product/list'),
                        fetch('/api/user/state')
                    ]);
                    const prodData = await prodRes.json();
                    const userData = await userRes.json();
                    
                    if (prodData.ok) setProducts(prodData.data);
                    if (userData.ok) setUser(userData.data);
                } catch (err) {
                    notify("Failed to fetch data", true);
                } finally {
                    setLoading(false);
                }
            };

            const notify = (msg, isError = false, bugId = null) => {
                setNotification({ msg, isError, bugId });
                setTimeout(() => setNotification(null), 4000);
            };

            const buyProduct = async (productId, priceOverride = null) => {
                const product = products.find(p => p.id === productId);
                const price = priceOverride !== null ? priceOverride : product.price;

                try {
                    const res = await fetch('/api/order/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ productId, price })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        notify(data.bugId ? `Bug Triggered: ${data.bugId}` : "Purchase successful!");
                        fetchData();
                    } else {
                        notify(data.error, true);
                    }
                } catch (err) {
                    notify("Request failed", true);
                }
            };

            const refundOrder = async (orderId) => {
                try {
                    const res = await fetch('/api/order/refund', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderId })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        notify(`Bug Triggered: ${data.bugId} - Refunded ${data.refundAmount}`);
                        fetchData();
                    }
                } catch (err) {
                    notify("Refund failed", true);
                }
            };

            const registerReferral = async (referredById) => {
                try {
                    const res = await fetch('/api/referral/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: 'ME', referredById })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        notify(`Bug Triggered: ${data.bugId} - Registered ${referredById}`);
                        fetchData();
                    }
                } catch (err) {
                    notify("Referral failed", true);
                }
            };

            const rejoin = async () => {
                try {
                    const res = await fetch('/api/user/rejoin', { method: 'POST' });
                    const data = await res.json();
                    if (data.ok) {
                        notify(`Bug Triggered: ${data.bugId} - Bonus ${data.bonus}`);
                        fetchData();
                    }
                } catch (err) {
                    notify("Rejoin failed", true);
                }
            };

            const upgrade = async (target) => {
                try {
                    const res = await fetch('/api/user/upgrade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ targetMembership: target })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        notify(`Bug Triggered: ${data.bugId} - Upgraded to ${target}`);
                        fetchData();
                    }
                } catch (err) {
                    notify("Upgrade failed", true);
                }
            };

            const reset = async () => {
                await fetch('/api/test/reset', { method: 'POST' });
                fetchData();
            };

            if (loading) return <div className="flex items-center justify-center h-screen serif text-2xl">Loading Gold Commerce...</div>;

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-100 p-6 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 className="text-3xl serif text-gray-800 tracking-widest">GOLD COMMERCE</h1>
                            <div className="flex gap-4 items-center">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-widest">ID: site007</span>
                                <button onClick={reset} className="text-xs text-red-400 hover:underline">Reset State</button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-4 gap-12">
                        {/* Sidebar: Profile & Actions */}
                        <div className="space-y-8">
                            <div className="gold-gradient p-8 rounded-3xl shadow-2xl text-white">
                                <h2 className="text-xs font-bold uppercase tracking-widest mb-2 opacity-80">Membership Tier</h2>
                                <div className="text-4xl serif mb-6">{user.membership}</div>
                                <div className="space-y-1">
                                    <div className="text-xs opacity-80">Current Balance</div>
                                    <div className="text-2xl font-bold">₩{user.balance.toLocaleString()}</div>
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-4">
                                <h3 className="text-sm font-bold text-gray-800 uppercase tracking-widest">User Actions</h3>
                                <div className="grid grid-cols-1 gap-2">
                                    <button 
                                        data-bug-id="site007-bug04"
                                        onClick={rejoin}
                                        className="w-full py-3 bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm transition-all"
                                    >
                                        Rejoin (Bonus)
                                    </button>
                                    <button 
                                        data-bug-id="site007-bug05"
                                        onClick={() => upgrade('SILVER')}
                                        className="w-full py-3 bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm transition-all"
                                    >
                                        Upgrade Tier
                                    </button>
                                    <button 
                                        data-bug-id="site007-bug03"
                                        onClick={() => registerReferral('ME')}
                                        className="w-full py-3 bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm transition-all"
                                    >
                                        Self-Referral (Cycle)
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Middle: Products */}
                        <div className="lg:col-span-2 space-y-8">
                            <h2 className="text-2xl serif border-b pb-4">Boutique Collection</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {products.map(p => (
                                    <div key={p.id} className="bg-white p-6 rounded-2xl border border-gray-100 hover:shadow-lg transition-all group">
                                        <div className="w-full h-40 bg-gray-50 rounded-xl mb-4 flex items-center justify-center text-gray-300">
                                            IMAGE
                                        </div>
                                        <h3 className="text-lg font-semibold text-gray-800 mb-1">{p.name}</h3>
                                        <p className="text-sm text-gray-400 mb-4">₩{p.price.toLocaleString()}</p>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => buyProduct(p.id)}
                                                className="flex-1 py-2 bg-gray-900 hover:bg-black text-white rounded-lg text-sm font-semibold transition-all"
                                            >
                                                Purchase
                                            </button>
                                            <button 
                                                data-bug-id="site007-bug01"
                                                onClick={() => buyProduct(p.id, "1000")}
                                                className="px-4 py-2 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-lg text-xs font-bold transition-all"
                                            >
                                                STR Buy
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Right: History */}
                        <div className="space-y-8">
                            <h2 className="text-2xl serif border-b pb-4">Orders</h2>
                            <div className="space-y-4">
                                {user.orders.length === 0 ? (
                                    <p className="text-gray-400 text-sm italic">No recent orders.</p>
                                ) : (
                                    user.orders.slice().reverse().map(o => (
                                        <div key={o.id} className="bg-white p-4 rounded-xl border border-gray-50 shadow-sm relative group">
                                            <div className="text-xs text-gray-400 mb-1">{new Date(o.date).toLocaleTimeString()}</div>
                                            <div className="text-sm font-bold text-gray-800">Order #{o.id.toString().slice(-4)}</div>
                                            <div className="text-xs text-amber-600 font-bold mb-3">₩{o.total.toLocaleString()}</div>
                                            <button 
                                                data-bug-id="site007-bug02"
                                                onClick={() => refundOrder(o.id)}
                                                className="w-full py-2 border border-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-400 rounded-lg text-xs font-bold transition-all"
                                            >
                                                Request Refund
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </main>

                    {/* Toast */}
                    {notification && (
                        <div className={`fixed bottom-10 right-10 px-8 py-4 rounded-2xl shadow-2xl z-50 transform transition-all ${notification.isError ? 'bg-red-600 text-white' : 'bg-gray-900 text-white'}`}>
                            <div className="flex flex-col">
                                <span className="font-bold">{notification.msg}</span>
                                {notification.bugId && <span className="text-xs opacity-70">ID: {notification.bugId}</span>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
