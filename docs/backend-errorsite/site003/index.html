<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BiteNow Delivery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    :root {
      --orange: #ff7e00;
      --orange-light: #fff2e5;
      --orange-dark: #cc6500;
      --text: #333333;
      --text-muted: #888888;
      --bg: #f8f9fa;
      --white: #ffffff;
      --border: #eeeeee;
      --error: #ef4444;
      --error-bg: #fee2e2;
    }

    body {
      margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
    }
    
    .container {
      max-width: 1200px; margin: 0 auto; display: flex; height: 100vh; overflow: hidden;
    }

    /* Sidebar / Triggers */
    .sidebar {
      width: 280px; background: var(--white); border-right: 1px solid var(--border);
      padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 1rem;
    }
    .brand { font-size: 2rem; font-weight: 700; color: var(--orange); }
    .nav-title { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-top: 1rem; }
    
    .btn { background: none; border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 0.5rem; cursor: pointer; text-align: left; font-family: inherit; font-size: 1rem; transition: 0.2s; }
    .btn:hover { background: var(--orange-light); border-color: var(--orange); }
    
    .bug-btn { background: var(--error-bg); border-color: #fca5a5; color: var(--error); font-weight: 500; font-size: 0.9rem; }
    .bug-btn:hover { background: #fecaca; }

    /* Main */
    .main { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 2rem; }
    
    /* Header / Steps */
    .header { display: flex; justify-content: space-between; align-items: center; }
    .steps { display: flex; gap: 1rem; align-items: center; }
    .step { padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.9rem; font-weight: 600; background: var(--white); border: 1px solid var(--border); color: var(--text-muted); }
    .step.active { background: var(--orange); color: var(--white); border-color: var(--orange); }

    .error-banner { background: var(--error-bg); color: var(--error); padding: 1rem 1.5rem; border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #fca5a5; font-size: 0.95rem; }

    /* Menu Grid */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .menu-card { background: var(--white); border-radius: 1rem; padding: 1.5rem; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; transition: transform 0.2s; }
    .menu-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .menu-title { font-weight: 600; font-size: 1.1rem; }
    .menu-price { color: var(--orange); font-weight: 700; font-size: 1.2rem; }
    .menu-category { font-size: 0.8rem; color: var(--text-muted); background: var(--bg); padding: 0.2rem 0.6rem; border-radius: 1rem; align-self: flex-start; }
    .add-btn { background: var(--orange); color: var(--white); border: none; padding: 0.6rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; margin-top: 0.5rem; transition: 0.2s; }
    .add-btn:hover { background: var(--orange-dark); }

    /* Cart & Order Status */
    .status-panel { background: var(--white); padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--border); }
    .status-panel h2 { margin-top: 0; font-size: 1.2rem; }
    .cart-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--border); }
    .action-row { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .action-btn { flex: 1; padding: 0.8rem; text-align: center; border-radius: 0.5rem; cursor: pointer; font-weight: 600; border: none; }
    .action-btn.primary { background: var(--orange); color: var(--white); }
    .action-btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  </style>  <script src="./pages-mock-api.js"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>  <script src="./pages-mock-api.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>  <script src="./pages-mock-api.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [menu, setMenu] = useState([]);
      const [orderState, setOrderState] = useState({ cart: [], status: 'idle', step: 1, isCancelled: false });
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        fetchMenu();
        fetchState();
      }, []);

      const fetchMenu = async () => {
        try {
          const res = await fetch('/api/menu');
          const data = await res.json();
          if (data.ok) setMenu(data.data);
        } catch (e) {}
      };

      const fetchState = async () => {
        try {
          const res = await fetch('/api/order');
          const data = await res.json();
          if (data.ok) setOrderState(data.state);
        } catch (e) {}
      };

      const handleApiCall = async (promise) => {
        setLoading(true);
        setError(null);
        try {
          const res = await promise;
          const data = await res.json();
          if (data.bugId) {
             setError({ message: 'Backend Logic Error Triggered', bugId: data.bugId });
          }
          await fetchState(); // sync state
        } catch (err) {
          setError({ message: err.message, bugId: null });
        } finally {
          setLoading(false);
        }
      };

      const addToCart = (item) => handleApiCall(fetch('/api/cart', {
        method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({item})
      }));

      const clearCart = () => handleApiCall(fetch('/api/cart', { method: 'DELETE' }));

      // Normal actions
      const doPay = () => handleApiCall(fetch('/api/order/pay', { method: 'POST' }));
      const doComplete = () => handleApiCall(fetch('/api/order/complete', { method: 'POST' }));
      const doCancel = () => handleApiCall(fetch('/api/order/cancel', { method: 'POST' }));

      // Bug Triggers
      const triggerBug01 = () => doComplete(); // Bypass payment
      const triggerBug02 = () => { clearCart().then(() => doPay()) }; // Pay with empty cart
      const triggerBug03 = () => handleApiCall(fetch('/api/order/status', {
        method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({newStatus: 'DELIVERING_PENDING_UNKNOWN'})
      }));
      const triggerBug04 = () => handleApiCall(fetch('/api/order/step', {
        method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({targetStep: 4})
      }));
      const triggerBug05 = () => handleApiCall(fetch('/api/order/conflict', { method: 'POST' }));
      const triggerBug06 = () => doCancel(); // Cancels but keeps status

      const total = orderState.cart.reduce((sum, item) => sum + item.price, 0);

      return (
        <div className="container">
          <aside className="sidebar">
            <div className="brand">🍕 BiteNow</div>
            
            <div className="nav-title">Normal Operations</div>
            <button className="btn" onClick={clearCart}>Clear Cart & Reset</button>
            <button className="btn" onClick={doPay} disabled={orderState.cart.length === 0 || orderState.step >= 3}>Proceed to Pay</button>
            <button className="btn" onClick={doComplete} disabled={orderState.step < 3}>Complete Order</button>
            <button className="btn" onClick={doCancel}>Cancel Order</button>

            <div className="nav-title" style={{marginTop:'2rem'}}>PPO Test Triggers</div>
            <button className="btn bug-btn" data-bug-id="site003-bug01" onClick={triggerBug01}>
              Bug 01: Bypass Workflow (Complete directly)
            </button>
            <button className="btn bug-btn" data-bug-id="site003-bug02" onClick={triggerBug02}>
              Bug 02: Pay with Empty Cart
            </button>
            <button className="btn bug-btn" data-bug-id="site003-bug03" onClick={triggerBug03}>
              Bug 03: Inject Unknown Status
            </button>
            <button className="btn bug-btn" data-bug-id="site003-bug04" onClick={triggerBug04}>
              Bug 04: Implicit Step Change
            </button>
            <button className="btn bug-btn" data-bug-id="site003-bug05" onClick={triggerBug05}>
              Bug 05: Race Condition (Pay + Cancel)
            </button>
            <button className="btn bug-btn" data-bug-id="site003-bug06" onClick={triggerBug06}>
              Bug 06: Cancel without State Reset
            </button>
          </aside>

          <main className="main">
            <header className="header">
              <h2>Order Delivery</h2>
              <div className="steps">
                <div className={`step ${orderState.step >= 1 ? 'active' : ''}`}>1. Cart</div>
                <div className={`step ${orderState.step >= 2 ? 'active' : ''}`}>2. Order</div>
                <div className={`step ${orderState.step >= 3 ? 'active' : ''}`}>3. Payment</div>
                <div className={`step ${orderState.step >= 4 ? 'active' : ''}`}>4. Complete</div>
              </div>
            </header>

            {error && (
              <div className="error-banner">
                <div>
                  <strong>Alert:</strong> {error.message}
                  {error.bugId && <span style={{marginLeft:'10px', background:'#fee2e2', padding:'2px 8px', borderRadius:'12px', border:'1px solid #fca5a5'}}>{error.bugId}</span>}
                </div>
                <button onClick={() => setError(null)} style={{background:'none', border:'none', cursor:'pointer', color:'var(--error)'}}>✖</button>
              </div>
            )}

            <div style={{display:'flex', gap:'2rem'}}>
              <div style={{flex: 2}}>
                <h3 style={{marginTop:0}}>Menu</h3>
                <div className="menu-grid">
                  {menu.map(item => (
                    <div className="menu-card" key={item.id}>
                      <span className="menu-category">{item.category}</span>
                      <span className="menu-title">{item.name}</span>
                      <span className="menu-price">${item.price}</span>
                      <button className="add-btn" onClick={() => addToCart(item)}>Add to Cart</button>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{flex: 1}}>
                <div className="status-panel">
                  <h2>Your Order Status</h2>
                  <div style={{margin:'1rem 0', padding:'1rem', background:'var(--bg)', borderRadius:'0.5rem', border:'1px solid var(--border)'}}>
                    <div style={{marginBottom:'0.5rem'}}>Status: <strong>{orderState.status.toUpperCase()}</strong></div>
                    <div>Cancelled: <strong>{orderState.isCancelled ? 'YES' : 'NO'}</strong></div>
                  </div>
                  
                  <h3>Cart Items ({orderState.cart.length})</h3>
                  {orderState.cart.length === 0 ? <p style={{color:'var(--text-muted)'}}>Cart is empty</p> : (
                    <div>
                      {orderState.cart.map((c, i) => (
                        <div className="cart-item" key={i}>
                          <span>{c.name}</span>
                          <strong>${c.price}</strong>
                        </div>
                      ))}
                      <div className="cart-item" style={{border:'none', marginTop:'1rem', fontSize:'1.2rem'}}>
                        <span>Total:</span>
                        <strong style={{color:'var(--orange)'}}>${total}</strong>
                      </div>
                    </div>
                  )}

                  {loading && <div style={{textAlign:'center', marginTop:'1rem', color:'var(--text-muted)'}}>Processing...</div>}
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
