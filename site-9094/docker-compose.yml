services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: space-mining-backend-9094
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./performance-logs:/app/logs
    expose:
      - "9094"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9094/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: space-mining-frontend-9094
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9094:9094"

networks:
  default:
    name: space-mining-9094-net
    ipam:
      config:
        - subnet: 10.90.94.0/24

volumes:
  performance-logs:
