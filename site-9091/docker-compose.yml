services:
  cyber-predict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber-predict-9091
    ports:
      - "9091:9091"
    environment:
      SERVER_PORT: "9091"
      CYBER_PREDICT_DEBUG: "true"
      CYBER_PREDICT_LOG_LEVEL: "TRACE"
      CYBER_PREDICT_INSECURE_MODE: "true"
      CYBER_PREDICT_SEED: "1337"
    volumes:
      - ./logs:/app/logs
    networks:
      - cyber-predict-9091-net
    restart: unless-stopped

networks:
  cyber-predict-9091-net:
    name: cyber-predict-9091-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.91.0/24
