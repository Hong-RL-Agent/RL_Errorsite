events {
    worker_connections 1024;
}

http {
    # MIME 타입 설정 (정적 파일 최적화)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        # 1. 백엔드 API 연결 (Index 430: IDOR 및 Index 440: N+1 테스트용)
        location /api/ {
            # 9042번과 마찬가지로 백엔드 포트를 8080으로 설정하고
            # 뒤에 슬래시(/)를 붙이지 않아 경로를 온전히 전달합니다.
            proxy_pass http://backend:8080;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. 백엔드 관리자 경로 (추가적인 보안 취약점 테스트용)
        location /admin/ {
            proxy_pass http://backend:8080;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. 프론트엔드 연결 (Index 420: Z-index 이슈 확인용)
        location / {
            # 빌드된 프론트엔드 컨테이너의 Nginx 포트인 80으로 연결합니다.
            proxy_pass http://frontend:80;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA(Vite) 대응을 위한 웹소켓 설정
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}