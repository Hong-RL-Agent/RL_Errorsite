<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | 글로벌 기상 예보 서비스</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); color: white; min-height: screen; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; }
        .weather-icon { font-size: 5rem; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3)); }
    </style>
</head>
<body class="p-4 md:p-12 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [weather, setWeather] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const fetchCurrent = async (region = 'seoul') => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/weather/current?region=${region}`);
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                    setWeather(json.data);
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            const checkDetail = async (city) => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/weather/detail?city=${city}`);
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                    alert(`풍속: ${json.data.detail.wind.speed}m/s`);
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            const triggerCoordBug = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/weather/coords?lat=N/A&lon=N/A');
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchCurrent();
            }, []);

            return (
                <div className="max-w-4xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-16 gap-8">
                        <div>
                            <h1 className="text-4xl font-black tracking-tighter">SkyCast.</h1>
                            <p className="text-blue-300 text-xs font-bold uppercase tracking-widest mt-1">Global Weather Terminal</p>
                        </div>
                        <div className="flex gap-4">
                            <button 
                                onClick={() => fetchCurrent('arctic')}
                                className="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-full text-xs font-black transition-all border border-white/10"
                                data-bug-id="site059-bug02"
                            >
                                ARCTIC FEED
                            </button>
                            <button 
                                onClick={triggerCoordBug}
                                className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-full text-xs font-black transition-all shadow-lg shadow-blue-900/50"
                                data-bug-id="site059-bug03"
                            >
                                FIND COORDS
                            </button>
                        </div>
                    </header>

                    {error && (
                        <div className="mb-10 p-6 glass border-rose-500/30 text-rose-300 flex items-center justify-between" data-bug-id={error.bugId}>
                            <div className="flex items-center gap-4">
                                <span className="text-3xl font-bold">!</span>
                                <div>
                                    <p className="font-black uppercase italic tracking-tighter text-lg">Atmospheric Anomaly</p>
                                    <p className="text-xs font-bold opacity-60">{error.message} (Trace: {error.bugId || "SYSTEM"})</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="glass p-12 mb-12 flex flex-col items-center text-center">
                        {loading ? (
                            <div className="py-20 animate-pulse text-4xl font-black text-blue-200 uppercase tracking-tighter">
                                Synchronizing Satellite...
                            </div>
                        ) : weather ? (
                            <>
                                <div className="weather-icon mb-6">
                                    {weather.condition === 'Sunny' ? '☀️' : '☁️'}
                                </div>
                                <h2 className="text-8xl font-black tracking-tighter mb-2">{weather.temp}°</h2>
                                <p className="text-2xl font-bold text-blue-300 mb-12 uppercase tracking-widest">{weather.condition}</p>
                                
                                <div className="grid grid-cols-2 gap-8 w-full max-w-sm">
                                    <button 
                                        onClick={() => checkDetail('seoul')}
                                        className="bg-white/5 p-6 rounded-3xl hover:bg-white/10 transition-all border border-white/5"
                                    >
                                        <p className="text-[10px] font-black text-blue-400 uppercase mb-1">Seoul</p>
                                        <p className="text-sm font-bold">Detail info</p>
                                    </button>
                                    <button 
                                        onClick={() => checkDetail('ghost-city')}
                                        className="bg-white/5 p-6 rounded-3xl hover:bg-white/10 transition-all border border-white/5 text-rose-400"
                                        data-bug-id="site059-bug01"
                                    >
                                        <p className="text-[10px] font-black opacity-50 uppercase mb-1">Ghost</p>
                                        <p className="text-sm font-bold">Unknown City</p>
                                    </button>
                                </div>
                            </>
                        ) : null}
                    </main>

                    <footer className="pt-12 border-t border-white/10 flex flex-col md:flex-row justify-between items-center gap-6">
                        <p className="text-white/20 text-[10px] font-black uppercase tracking-[0.4em]">© 2026 SkyCast Meteorology Systems | SITE059</p>
                        <div className="flex gap-8 text-[10px] font-black text-white/30 uppercase">
                            <a href="#" className="hover:text-blue-400 transition-colors">Forecasting</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">Sat-Map</a>
                            <a href="#" className="hover:text-blue-400 transition-colors">Alerts</a>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
