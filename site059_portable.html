<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Pro | Enterprise Messaging</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/@3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4a154b; --sidebar-bg: #3f0e40; --sidebar-hover: rgba(255,255,255,0.1); --active: #1164a3; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1d1c1d; margin: 0; overflow: hidden; }
        .sidebar { background-color: var(--sidebar-bg); width: 260px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 50; color: rgba(255,255,255,0.7); display: flex; flex-direction: column; }
        .main-content { margin-left: 260px; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; cursor: pointer; transition: all 0.1s; font-size: 0.95rem; border-radius: 4px; margin: 0 8px; }
        .nav-item:hover { background-color: var(--sidebar-hover); color: white; }
        .nav-item.active { background-color: var(--active); color: white; }
        .header { height: 64px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; background: white; }
        .message-feed { flex: 1; overflow-y: auto; padding: 20px 0; background: white; }
        .msg-group { padding: 8px 24px; transition: background 0.1s; display: flex; gap: 12px; cursor: pointer; }
        .msg-group:hover { background: #f8f8f8; }
        .avatar { width: 36px; height: 36px; border-radius: 4px; background: #e2e8f0; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #333; flex-shrink: 0; }
        .attachment { background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 8px; display: flex; align-items: center; gap: 12px; max-width: 400px; transition: border-color 0.2s; }
        .attachment:hover { border-color: #1164a3; background: #f1f3f5; }
        .bug-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideDown { from { transform: translateY(-100%) translateX(-50%); opacity: 0; } to { transform: translateY(0) translateX(-50%); opacity: 1; } }
        .sidebar-section { margin-top: 24px; }
        .sidebar-title { padding: 0 24px; font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.4); margin-bottom: 8px; text-transform: uppercase; }
        .presence { width: 10px; height: 10px; border-radius: 50%; background: #2bac76; border: 2px solid var(--sidebar-bg); }
        .presence.away { background: #616061; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal { background: white; width: 500px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CHANNELS = [
            { id: 'infra', name: 'infra-security', icon: '#' },
            { id: 'dev', name: 'dev-general', icon: '#' },
            { id: 'announce', name: 'announcements', icon: '📢' }
        ];

        const DMS = [
            { id: 'jason', name: 'Jason', status: 'away', avatar: 'J' },
            { id: 'sarah', name: 'Sarah', status: 'online', avatar: 'S' }
        ];

        function App() {
            const [view, setView] = useState('infra');
            const [messages, setMessages] = useState([
                { id: 1, text: "오전 서버 패치 작업 완료되었습니다. 현재 정상 가동 중입니다.", time: "14:20", user: "Jason", avatar: "J" },
                { id: 2, text: "수고하셨습니다. 보안 점검 리포트 공유드립니다.", time: "14:25", user: "Sarah", avatar: "S", file: { name: "security_audit_Q2.pdf", size: "1.2 MB" } },
                { id: 3, text: "내용 확인하겠습니다.", time: "14:30", user: "David", avatar: "D" }
            ]);
            const [input, setInput] = useState("");
            const [activeBug, setActiveBug] = useState(null);
            const [isHistoryLoading, setIsHistoryLoading] = useState(false);
            const [syncState, setSyncState] = useState("CONNECTED");
            const [modal, setModal] = useState(null);

            const triggerBug = (id) => {
                if (!id) return;
                setActiveBug(id);
                setTimeout(() => setActiveBug(null), 3000);
            };

            const handleSend = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                triggerBug("site059-bug02"); // Message Loss
                setInput("");
            };

            const loadHistory = () => {
                setIsHistoryLoading(true);
                setTimeout(() => {
                    const history = [
                        { id: -1, text: "네, 복구 작업 마무리 단계입니다.", time: "11:05", user: "Jason", avatar: "J" },
                        { id: -2, text: "서버 접속이 안 됩니다.", time: "11:00", user: "David", avatar: "D" }
                    ];
                    setMessages([...history, ...messages]);
                    setIsHistoryLoading(false);
                    triggerBug("site059-bug01"); // Order Inversion
                }, 400);
            };

            const handleFileClick = (file) => {
                setModal({ type: 'file', data: { ...file, sysSize: "5.4 MB" } });
                triggerBug("site059-bug04"); // Mismatch Reveal
            };

            const renderView = () => {
                if (view === 'infra') {
                    return (
                        <div className="flex flex-col h-full bg-white">
                            <header className="header shadow-sm z-10">
                                <div className="flex items-center gap-2">
                                    <h2 className="text-lg font-black tracking-tight"># infra-security</h2>
                                    <span className="text-gray-300 cursor-pointer hover:text-yellow-400">⭐</span>
                                </div>
                                <div className="flex items-center gap-4">
                                    <button onClick={() => {setSyncState("DESYNC_ERROR"); triggerBug("site059-bug03");}} className="text-[11px] font-bold text-gray-500 hover:text-purple-700 bg-gray-100 px-3 py-1.5 rounded">Mark Read</button>
                                </div>
                            </header>
                            <div className="message-feed">
                                <div className="flex justify-center mb-6">
                                    <button onClick={loadHistory} className="text-xs font-bold text-blue-600 hover:underline px-4 py-2 bg-gray-50 rounded-full border border-gray-100">
                                        {isHistoryLoading ? "Synchronizing history..." : "↑ Load Older Messages"}
                                    </button>
                                </div>
                                {messages.map(m => (
                                    <div key={m.id} className="msg-group">
                                        <div className="avatar">{m.avatar}</div>
                                        <div className="msg-body">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="user font-black text-sm">{m.user}</span>
                                                <span className="time text-[10px] text-gray-400 font-bold">{m.time}</span>
                                            </div>
                                            <div className="text text-sm">{m.text}</div>
                                            {m.file && (
                                                <div className="attachment cursor-pointer" onClick={() => handleFileClick(m.file)}>
                                                    <div className="w-10 h-10 bg-red-100 text-red-600 rounded flex items-center justify-center font-black text-[10px]">PDF</div>
                                                    <div className="flex-1">
                                                        <p className="text-xs font-bold text-gray-800">{m.file.name}</p>
                                                        <p className="text-[10px] text-gray-400">{m.file.size}</p>
                                                    </div>
                                                    <span className="text-[10px] text-blue-600 font-bold opacity-0 group-hover:opacity-100">View</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <footer className="p-4 border-t border-gray-100">
                                <div className="border-2 border-gray-200 rounded-xl flex items-end p-2 focus-within:border-gray-400 transition-all">
                                    <button onClick={() => alert("File attachment opened")} className="w-10 h-10 flex items-center justify-center text-gray-400 hover:bg-gray-100 rounded-lg text-xl">＋</button>
                                    <form onSubmit={handleSend} className="flex-1">
                                        <input 
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            placeholder="Message to #infra-security" 
                                            className="w-full bg-transparent border-none px-3 py-2 text-sm outline-none font-medium" 
                                        />
                                    </form>
                                    <button onClick={() => alert("Emoji picker opened")} className="w-10 h-10 flex items-center justify-center text-gray-400 hover:bg-gray-100 rounded-lg text-xl">☺</button>
                                </div>
                            </footer>
                        </div>
                    );
                }
                if (view === 'compliance') {
                    return (
                        <div className="page-content p-12 bg-white h-full overflow-y-auto">
                            <h2 className="text-2xl font-black mb-10 tracking-tight">Security Compliance & Log Audit</h2>
                            <div className="grid grid-cols-1 gap-10">
                                <section>
                                    <h3 className="text-xs font-black text-gray-400 uppercase tracking-widest mb-6">Attachment Audit Log</h3>
                                    <div className="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                        <table className="w-full text-left">
                                            <thead className="bg-gray-50 border-b border-gray-200">
                                                <tr>
                                                    <th className="p-5 text-[10px] font-bold text-gray-500 uppercase">Document Asset</th>
                                                    <th className="p-5 text-[10px] font-bold text-gray-500 uppercase">System Integrity Size</th>
                                                    <th className="p-5 text-[10px] font-bold text-gray-500 uppercase">Audit Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100 text-sm">
                                                <tr className="hover:bg-gray-50 cursor-pointer" onClick={() => triggerBug("site059-bug04")}>
                                                    <td className="p-5 font-bold text-gray-800 underline decoration-blue-100">security_audit_Q2.pdf</td>
                                                    <td className="p-5 font-mono text-red-600 font-black">5.4 MB</td>
                                                    <td className="p-5"><span className="text-[10px] font-black bg-blue-100 text-blue-600 px-3 py-1 rounded-full">AUDITED</span></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                                <section>
                                    <h3 className="text-xs font-black text-gray-400 uppercase tracking-widest mb-6">Synchronization Status</h3>
                                    <div className="p-8 bg-gray-50 rounded-2xl border border-gray-200 flex justify-between items-center">
                                        <div>
                                            <p className="text-sm font-bold text-gray-800">State Delta Check</p>
                                            <p className="text-xs text-gray-400 mt-1">Cross-reference between client cache and server store.</p>
                                        </div>
                                        <span className={`text-xs font-black px-4 py-2 rounded-lg shadow-sm ${syncState === 'CONNECTED' ? 'bg-emerald-500 text-white' : 'bg-red-600 text-white animate-pulse'}`}>
                                            {syncState === 'CONNECTED' ? 'SYNC_OK' : 'SYNC_ERROR (BUG_03)'}
                                        </span>
                                    </div>
                                </section>
                            </div>
                        </div>
                    );
                }
                // Placeholder for other channels/DMs
                return (
                    <div className="flex flex-col items-center justify-center h-full text-gray-300">
                        <span className="text-6xl mb-4">💬</span>
                        <p className="font-bold"># {view} is currently empty.</p>
                        <button onClick={() => setView('infra')} className="mt-4 text-sm text-blue-600 font-bold hover:underline">Return to infra-security</button>
                    </div>
                );
            };

            return (
                <div className="flex w-full min-h-screen">
                    {activeBug && (
                        <div className="bug-toast">
                            <div className="bg-slate-900 text-white px-6 py-3 rounded shadow-2xl flex items-center gap-3 font-mono font-bold text-xs border border-white/10 ring-4 ring-blue-500/10">
                                <span className="text-blue-400 animate-pulse">#</span> bugid : {activeBug}
                            </div>
                        </div>
                    )}

                    {modal && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="modal animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                                    <h3 className="font-black text-gray-800">File Properties</h3>
                                    <button onClick={() => setModal(null)} className="text-gray-400 hover:text-gray-800">✕</button>
                                </div>
                                <div className="p-8 space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-16 h-16 bg-red-50 text-red-600 rounded-xl flex items-center justify-center font-black text-xl">PDF</div>
                                        <div>
                                            <p className="text-lg font-black text-gray-900">{modal.data.name}</p>
                                            <p className="text-xs text-gray-400 font-bold uppercase">Shared by Sarah • 14:25</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                                            <p className="text-[10px] font-black text-gray-400 uppercase mb-1">Preview Label</p>
                                            <p className="text-sm font-bold text-gray-700">{modal.data.size}</p>
                                        </div>
                                        <div className="bg-red-50 p-4 rounded-xl border border-red-100">
                                            <p className="text-[10px] font-black text-red-400 uppercase mb-1">Actual Metadata</p>
                                            <p className="text-sm font-black text-red-600">{modal.data.sysSize}</p>
                                        </div>
                                    </div>
                                    <div className="p-4 bg-blue-50 rounded-xl text-[10px] text-blue-600 leading-relaxed font-bold italic">
                                        Note: Mismatch detected between display metadata and system core records.
                                    </div>
                                </div>
                                <div className="p-4 bg-gray-50 border-t border-gray-100 flex justify-end">
                                    <button onClick={() => alert("Download started (Mock)")} className="bg-blue-600 text-white px-6 py-2 rounded-lg text-xs font-bold shadow-lg shadow-blue-200">Download Official Version</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <aside className="sidebar flex flex-col shadow-2xl">
                        <div onClick={() => alert("Workspace switcher opened")} className="p-5 flex items-center justify-between border-b border-white/5 cursor-pointer hover:bg-white/5 transition-all">
                            <div className="flex flex-col">
                                <span className="text-white font-black text-lg tracking-tight">Stream Pro</span>
                                <div className="flex items-center gap-1.5 mt-1">
                                    <div className="presence"></div>
                                    <span className="text-[11px] font-bold text-white/50">David (You)</span>
                                </div>
                            </div>
                            <span className="text-white/30 text-xl">📝</span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto py-4">
                            <div className="sidebar-section">
                                <div className="sidebar-title">Main</div>
                                <div onClick={() => setView('infra')} className={`nav-item ${view === 'infra' ? 'active' : ''}`}>💬 <span>infra-security</span></div>
                                <div onClick={() => setView('compliance')} className={`nav-item ${view === 'compliance' ? 'active' : ''}`}>🛡️ <span>Compliance & Logs</span></div>
                            </div>

                            <div className="sidebar-section">
                                <div className="sidebar-title">Channels</div>
                                {CHANNELS.filter(c => c.id !== 'infra').map(c => (
                                    <div key={c.id} onClick={() => setView(c.name)} className={`nav-item ${view === c.name ? 'active' : ''}`}>
                                        <span className="text-white/40">{c.icon}</span> <span>{c.name}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="sidebar-section">
                                <div className="sidebar-title">Direct Messages</div>
                                {DMS.map(dm => (
                                    <div key={dm.id} onClick={() => setView(dm.name)} className={`nav-item ${view === dm.name ? 'active' : ''}`}>
                                        <div className={`presence ${dm.status === 'away' ? 'away' : ''}`}></div>
                                        <span>{dm.name}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-5 mt-auto border-t border-white/5 bg-black/10 flex items-center justify-between">
                            <div onClick={() => alert("User profile opened")} className="flex items-center gap-3 cursor-pointer">
                                <div className="w-9 h-9 rounded-lg bg-blue-500 flex items-center justify-center text-white font-black text-sm">D</div>
                                <span className="text-xs font-bold text-white/80">Stream Workspace</span>
                            </div>
                            <span onClick={() => alert("Preferences opened")} className="text-white/30 text-xl cursor-pointer hover:text-white transition-colors">⚙️</span>
                        </div>
                    </aside>

                    <main className="main-content flex-1">
                        {renderView()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
