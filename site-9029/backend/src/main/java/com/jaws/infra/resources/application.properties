# 1. 서버 포트 설정
server.port=8080

# [인프라 오류] Actuator 엔드포인트를 전체 노출 (보안 결함)
# 원래는 health, info 정도만 노출해야 하지만, *을 써서 env, beans, mappings 등 모든 정보를 노출함
management.endpoints.web.exposure.include=*

# 서버 에러 발생 시 상세 메시지 노출 (스택 트레이스 노출 결함)
server.error.include-message=always
server.error.include-stacktrace=always