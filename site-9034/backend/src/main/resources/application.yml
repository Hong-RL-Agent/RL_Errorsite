server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:dbfault;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      indent-output: true
