services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melody-ai-backend
    ports:
      - "19063:9063"
    environment:
      SERVER_PORT: "9063"
      FRONTEND_ORIGIN: "http://localhost:9063"
      BACKEND_ORIGIN: "http://localhost:19063"
      CORS_ALLOWED_ORIGINS: "http://localhost:9063,http://localhost:5173,http://localhost:19063"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9063/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: melody-ai-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9063:5173"
    environment:
      VITE_API_PROXY_TARGET: "http://backend:9063"
      VITE_PROXY_ORIGIN: "http://localhost:9063"
