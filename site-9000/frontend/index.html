<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JAWS 훈련 환경 #9000</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .error-msg { color: #d9534f; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 JAWS 테스트 게시판 (Port: 9000)</h1>
        <p>이 사이트는 <strong>서버 인프라 설정 오류</strong>를 포함하고 있습니다.</p>
        <hr>
        <button onclick="fetchData()">게시글 불러오기</button>
        <div id="log" class="error-msg"></div>
    </div>

    <script>
        function fetchData() {
            const log = document.getElementById('log');
            log.innerText = "데이터 요청 중...";
            fetch('/api/data')
                .then(res => {
                    if (!res.ok) throw new Error(res.status);
                    return res.json();
                })
                .catch(err => {
                    log.innerText = "❌ 오류 감지: 502 Bad Gateway (Nginx Upstream Error)";
                });
        }
    </script>
</body>
</html>
