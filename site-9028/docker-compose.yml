services:
  nginx:
    image: nginx:alpine
    container_name: site-9028-nginx
    ports:
      - "9028:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: site-9028-backend
    ports:
      - "50010:8080"