<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollMaster Pro | 엔터프라이즈 설문 솔루션</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfd; color: #101828; margin: 0; }
        .sidebar { background-color: #ffffff; border-right: 1px solid #f2f4f7; width: 300px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 50; }
        .main-content { margin-left: 300px; padding: 48px; min-height: 100vh; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 16px; border-radius: 8px; color: #475467; cursor: pointer; transition: all 0.2s; font-weight: 600; font-size: 0.9rem; }
        .nav-link:hover { background-color: #f9fafb; color: #101828; }
        .nav-link.active { background-color: #f4ebff; color: #7f56d9; }
        .card { background: white; border: 1px solid #eaecf0; border-radius: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
        .badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
        .badge-live { background: #ecfdf3; color: #027a48; }
        .badge-archived { background: #f2f4f7; color: #344054; }
        .btn-primary { background: #7f56d9; color: #ffffff; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; border: 1px solid #7f56d9; }
        .btn-primary:hover { background: #6941c6; }
        .progress-bar { height: 8px; border-radius: 4px; background-color: #f2f4f7; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .page-content { animation: fadeIn 0.4s ease-out; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bug-toast { animation: slideDown 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: fixed; top: 24px; left: 55%; transform: translateX(-50%); z-index: 1000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_POLLS = [
            {
                id: 1,
                question: "2026년 기업 AI 도입 전략 설문",
                totalVotes: 115, 
                status: "live",
                options: [
                    { id: 1, text: "생성형 AI 전사 확대", votes: 60 },
                    { id: 2, text: "특정 부서 파일럿 운영", votes: 35 },
                    { id: 3, text: "인프라 구축 및 검토", votes: 20 }
                ]
            },
            {
                id: 2,
                question: "사내 복지 만족도 조사 (상반기)",
                totalVotes: 85,
                status: "archived", 
                options: [
                    { id: 1, text: "매우 만족", votes: 50 },
                    { id: 2, text: "보통", votes: 25 },
                    { id: 3, text: "개선 필요", votes: 10 }
                ]
            }
        ];

        function App() {
            const [view, setView] = useState('poll-1');
            const [polls, setPolls] = useState(INITIAL_POLLS);
            const [logs, setLogs] = useState([
                { id: 1, time: "10:20:01", user: "admin_dev", action: "POLL_ACCESS", status: "SUCCESS" },
                { id: 2, time: "10:18:45", user: "system", action: "CACHE_SYNC", status: "HEALTHY" }
            ]);
            const [activeBug, setActiveBug] = useState(null);
            const [votedWelfare, setVotedWelfare] = useState(false);

            const triggerBug = (id) => {
                if (!id) return;
                setActiveBug(id);
                setTimeout(() => setActiveBug(null), 3000);
            };

            const handleVoteAI = (optionId) => {
                const poll = polls[0];
                let targetOptionId = optionId;
                let bugToTrigger = null;

                if (optionId === 1) {
                    targetOptionId = 2;
                    bugToTrigger = "site060-bug03";
                } 
                else if (optionId === 2 || optionId === 3) {
                    bugToTrigger = "site060-bug02";
                }

                setPolls(prev => prev.map(p => {
                    if (p.id === 1) {
                        const newOpts = p.options.map(o => o.id === targetOptionId ? { ...o, votes: o.votes + 1 } : o);
                        const newTotal = (optionId === 2 || optionId === 3) ? p.totalVotes : p.totalVotes + 1;
                        return { ...p, totalVotes: newTotal, options: newOpts };
                    }
                    return p;
                }));

                triggerBug(bugToTrigger);
                setLogs([{ id: Date.now(), time: new Date().toLocaleTimeString(), user: "Current_User", action: "AI_VOTE_SUBMIT", status: "SUCCESS" }, ...logs]);
            };

            const handleVoteWelfare = (optionId) => {
                if (votedWelfare) return;

                triggerBug("site060-bug04"); 
                
                setPolls(prev => prev.map(p => {
                    if (p.id === 2) {
                        const newOpts = p.options.map(o => o.id === optionId ? { ...o, votes: o.votes + 1 } : o);
                        return { ...p, totalVotes: p.totalVotes + 1, options: newOpts };
                    }
                    return p;
                }));

                setVotedWelfare(true);
                setLogs([{ id: Date.now(), time: new Date().toLocaleTimeString(), user: "Current_User", action: "WELFARE_VOTE_SUBMIT", status: "SUCCESS" }, ...logs]);
            };

            const runIntegrityAudit = () => {
                const p1 = polls[0];
                const sum = p1.options.reduce((acc, o) => acc + o.votes, 0);
                if (sum !== p1.totalVotes) {
                    triggerBug("site060-bug02");
                }
            };

            const renderContent = () => {
                if (view === 'poll-1') {
                    const p = polls[0];
                    return (
                        <div className="page-content">
                            <div className="flex justify-between items-end mb-10">
                                <div>
                                    <span className="badge badge-live mb-3 inline-block">LIVE SURVEY</span>
                                    <h1 className="text-2xl font-bold text-gray-900">{p.question}</h1>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="card p-8">
                                    <h3 className="font-bold text-gray-700 mb-6">투표하기</h3>
                                    <div className="space-y-4">
                                        {p.options.map(o => (
                                            <button 
                                                key={o.id}
                                                onClick={() => handleVoteAI(o.id)}
                                                className="w-full text-left p-5 rounded-xl border border-gray-100 hover:border-purple-300 hover:bg-purple-50/50 transition-all group"
                                            >
                                                <div className="flex justify-between items-center">
                                                    <span className="font-semibold text-gray-700">{o.text}</span>
                                                    <span className="text-xs font-bold text-purple-600 opacity-0 group-hover:opacity-100 transition-opacity">VOTE</span>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="card p-8 bg-gray-50/30">
                                    <div className="flex justify-between items-center mb-8">
                                        <h3 className="font-bold text-gray-400 uppercase text-xs tracking-widest">실시간 집계 현황</h3>
                                        <div className="text-right">
                                            <p className="text-[10px] font-bold text-gray-400 uppercase">Total Votes (Counter)</p>
                                            <p className="text-2xl font-black text-gray-900">{p.totalVotes}</p>
                                        </div>
                                    </div>
                                    <div className="space-y-8">
                                        {p.options.map(o => {
                                            const pct = p.totalVotes > 0 ? Math.round((o.votes / p.totalVotes) * 100) : 0;
                                            return (
                                                <div key={o.id}>
                                                    <div className="flex justify-between text-xs font-bold mb-2">
                                                        <span className="text-gray-600">{o.text}</span>
                                                        <span className="text-purple-600">{o.votes}표</span>
                                                    </div>
                                                    <div className="progress-bar">
                                                        <div className="progress-fill bg-purple-500" style={{width: `${pct}%`}}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-10 pt-6 border-t border-gray-100 text-[10px] text-gray-400 font-medium">
                                        ※ 집계 엔진 오류 시 Total Votes 수치와 개별 투표 합계가 일치하지 않을 수 있습니다.
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
                if (view === 'poll-2') {
                    const p = polls[1];
                    return (
                        <div className="page-content">
                            <div className="flex justify-between items-end mb-10">
                                <div>
                                    <span className="badge badge-archived mb-3 inline-block">ARCHIVED SURVEY</span>
                                    <h1 className="text-2xl font-bold text-gray-900">{p.question}</h1>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="card p-8">
                                    <h3 className="font-bold text-gray-700 mb-6">투표 참여</h3>
                                    {votedWelfare ? (
                                        <div className="p-10 text-center bg-gray-50 rounded-2xl border border-dashed border-gray-200">
                                            <p className="text-gray-400 font-bold">이미 투표를 완료했습니다.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {p.options.map(o => (
                                                <button 
                                                    key={o.id}
                                                    onClick={() => handleVoteWelfare(o.id)}
                                                    className="w-full text-left p-5 rounded-xl border border-gray-100 hover:border-purple-300 hover:bg-purple-50/50 transition-all"
                                                >
                                                    <span className="font-semibold text-gray-700">{o.text}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="card p-8">
                                    <h3 className="font-bold text-gray-400 uppercase text-xs mb-8 tracking-widest">최종 결과 데이터</h3>
                                    <div className="space-y-8">
                                        {p.options.map(o => {
                                            const pct = p.totalVotes > 0 ? Math.round((o.votes / p.totalVotes) * 100) : 0;
                                            return (
                                                <div key={o.id}>
                                                    <div className="flex justify-between text-xs font-bold mb-2">
                                                        <span className="text-gray-600">{o.text}</span>
                                                        <span className="text-gray-400">{o.votes}표</span>
                                                    </div>
                                                    <div className="progress-bar">
                                                        <div className="progress-fill bg-gray-300" style={{width: `${pct}%`}}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }
                if (view === 'audit') {
                    return (
                        <div className="page-content">
                            <div className="flex justify-between items-center mb-10">
                                <h2 className="text-2xl font-bold text-gray-900">감사 및 보안 감사</h2>
                                <button onClick={runIntegrityAudit} className="btn-primary text-xs">시스템 무결성 검사</button>
                            </div>
                            <div className="card overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-gray-50 border-b border-gray-100">
                                        <tr>
                                            <th className="p-4 text-xs font-bold text-gray-500 uppercase">Timestamp</th>
                                            <th className="p-4 text-xs font-bold text-gray-500 uppercase">User</th>
                                            <th className="p-4 text-xs font-bold text-gray-500 uppercase">Action</th>
                                            <th className="p-4 text-xs font-bold text-gray-500 uppercase">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-50">
                                        {logs.map(l => (
                                            <tr key={l.id} className="text-sm">
                                                <td className="p-4 font-mono text-gray-400">{l.time}</td>
                                                <td className="p-4 font-semibold text-gray-700">{l.user}</td>
                                                <td className="p-4 text-gray-600">{l.action}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded text-[10px] font-bold ${l.status === 'SUCCESS' ? 'bg-emerald-50 text-emerald-700' : 'bg-blue-50 text-blue-700'}`}>{l.status}</span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    );
                }
            };

            return (
                <div className="flex w-full min-h-screen">
                    {activeBug && (
                        <div className="bug-toast">
                            <div className="bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 font-mono font-bold text-xs border border-white/10">
                                <span className="text-purple-400">🛡️</span> bugid : {activeBug}
                            </div>
                        </div>
                    )}

                    <aside className="sidebar flex flex-col py-10 shadow-sm">
                        <div className="flex items-center gap-3 mb-16 px-10">
                            <div className="w-10 h-10 bg-purple-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-purple-200">P</div>
                            <h2 className="text-xl font-bold tracking-tight text-gray-900">PollMaster <span className="text-purple-600">Pro</span></h2>
                        </div>
                        <nav className="flex-1">
                            <div className="px-10 mb-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">진행 중인 설문</div>
                            <div onClick={() => setView('poll-1')} className={`nav-link ${view === 'poll-1' ? 'active' : ''}`}>🤖 <span>AI 도입 전략 설문</span></div>
                            
                            <div className="px-10 mt-10 mb-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">보관된 설문</div>
                            <div onClick={() => setView('poll-2')} className={`nav-link ${view === 'poll-2' ? 'active' : ''}`}>🤝 <span>사내 복지 만족도</span></div>
                            
                            <div className="px-10 mt-10 mb-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">시스템</div>
                            <div onClick={() => setView('audit')} className={`nav-link ${view === 'audit' ? 'active' : ''}`}>🛡️ <span>감사 및 보안</span></div>
                        </nav>
                        <div className="mt-auto px-10 py-6 border-t border-gray-50 text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                            Enterprise v4.0.5
                        </div>
                    </aside>

                    <main className="main-content flex-1">
                        {renderContent()}
                        <footer className="mt-20 py-12 border-t border-gray-50 text-center text-[10px] font-black text-gray-300 uppercase tracking-[0.4em]">
                            © 2026 PollMaster Analytics • Data Integrity 060
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
