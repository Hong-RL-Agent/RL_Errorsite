server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://ocean-guard-backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 9077;
  }

  location /graphql {
    proxy_pass http://ocean-guard-backend:8080/graphql;
    proxy_set_header Host $host;
  }

  location /ws/ {
    proxy_pass http://ocean-guard-backend:8080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
