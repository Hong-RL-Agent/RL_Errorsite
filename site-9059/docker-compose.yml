version: '3.8'

services:
  backend:
    image: gradle:8.7-jdk17
    container_name: smart-traffic-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: gradle bootRun
    ports:
      - "8085:8080"

  frontend:
    image: node:20
    container_name: smart-traffic-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Network condition simulation can be added here if needed, 
    # but application-level defects are implemented in code.
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "9059:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8085/api
