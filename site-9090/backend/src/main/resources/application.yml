server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30d

spring:
  application:
    name: ART-APPRAISER
  datasource:
    url: jdbc:h2:mem:artappraiser;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  public-origin: ${APP_PUBLIC_ORIGIN:http://localhost:9090}
