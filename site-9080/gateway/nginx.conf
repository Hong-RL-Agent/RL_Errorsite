events {}

http {
  upstream smart_port_api {
    server smart-port-api:9080;
  }

  upstream smart_port_console {
    server smart-port-console:5173;
  }

  server {
    listen 9080;
    server_name localhost;

    access_log /var/log/nginx/smart-port-access.log;
    error_log /var/log/nginx/smart-port-error.log warn;

    location /api/ {
      proxy_pass http://smart_port_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port 9080;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://smart_port_console;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port 9080;
    }
  }
}
