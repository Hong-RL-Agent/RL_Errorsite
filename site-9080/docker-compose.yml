services:
  smart-port-api:
    build:
      context: ./backend
    container_name: smart-port-api-9080
    expose:
      - "9080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - smart-port-security-logs:/app/logs
    networks:
      - smart-port-9080

  smart-port-console:
    build:
      context: ./frontend
    container_name: smart-port-console-9080
    expose:
      - "5173"
    depends_on:
      - smart-port-api
    networks:
      - smart-port-9080

  smart-port-gateway:
    image: nginx:1.27-alpine
    container_name: smart-port-gateway-9080
    depends_on:
      - smart-port-api
      - smart-port-console
    ports:
      - "9080:9080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - smart-port-gateway-logs:/var/log/nginx
    networks:
      - smart-port-9080

networks:
  smart-port-9080:
    name: smart-port-9080
    ipam:
      config:
        - subnet: 10.90.80.0/24

volumes:
  smart-port-security-logs:
    name: smart-port-security-logs-9080
  smart-port-gateway-logs:
    name: smart-port-gateway-logs-9080
