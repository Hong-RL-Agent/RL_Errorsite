<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineEdu | 글로벌 온라인 학습 플랫폼</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0f4f8; color: #1a202c; }
        .course-card { background: white; border-radius: 1rem; transition: all 0.3s; border: 1px solid #e2e8f0; }
        .course-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border-color: #4299e1; }
        .sidebar { background: #1a202c; color: white; border-radius: 1.5rem; }
    </style>
</head>
<body class="p-4 md:p-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [courses, setCourses] = useState([]);
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [page, setPage] = useState(1);

            const fetchCourses = async (p = 1) => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch(`/api/courses?page=${p}&limit=5`);
                    const json = await res.json();
                    setCourses(json.data);
                    if (json.bugId) console.log("Bug Active:", json.bugId);
                } catch (err) {
                    setError({ message: "데이터 로드 실패" });
                } finally {
                    setLoading(false);
                }
            };

            const fetchStats = async () => {
                const res = await fetch('/api/stats/category-average');
                const json = await res.json();
                setStats(json);
            };

            const triggerDetailBug = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/courses/course-alpha');
                    const json = await res.json();
                    if (!res.ok) throw { message: json.message, bugId: json.bugId };
                } catch (err) {
                    setError(err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchCourses(page);
                fetchStats();
            }, [page]);

            return (
                <div className="max-w-7xl mx-auto flex flex-col lg:flex-row gap-12">
                    <aside className="lg:w-80 sidebar p-8 h-fit">
                        <h2 className="text-2xl font-black mb-8 tracking-tighter">OnlineEdu</h2>
                        <div className="space-y-6">
                            <div>
                                <p className="text-[10px] font-black uppercase text-slate-500 mb-2">Category Stats</p>
                                {stats && (
                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700" data-bug-id="site053-bug03">
                                        <p className="text-xs text-slate-400">Avg Course Rating</p>
                                        <p className="text-2xl font-black text-blue-400">{stats.averageRating} ⭐</p>
                                    </div>
                                )}
                            </div>
                            <nav className="flex flex-col gap-2">
                                <p className="text-[10px] font-black uppercase text-slate-500 mb-2">Navigation</p>
                                <button className="text-left text-sm font-bold hover:text-blue-400 transition-colors">All Courses</button>
                                <button onClick={triggerDetailBug} className="text-left text-sm font-bold text-rose-400 hover:text-rose-300 transition-colors" data-bug-id="site053-bug02">My Learning (BUG)</button>
                                <button className="text-left text-sm font-bold hover:text-blue-400 transition-colors">Certificates</button>
                            </nav>
                        </div>
                    </aside>

                    <main className="flex-1">
                        <header className="flex justify-between items-center mb-12">
                            <h2 className="text-4xl font-black tracking-tighter">추천 강의 리스트</h2>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setPage(1)} 
                                    className={`w-10 h-10 rounded-xl font-bold ${page === 1 ? 'bg-blue-600 text-white' : 'bg-white text-slate-600'}`}
                                    data-bug-id="site053-bug01"
                                >
                                    1
                                </button>
                                <button 
                                    onClick={() => setPage(2)} 
                                    className={`w-10 h-10 rounded-xl font-bold ${page === 2 ? 'bg-blue-600 text-white' : 'bg-white text-slate-600'}`}
                                >
                                    2
                                </button>
                            </div>
                        </header>

                        {error && (
                            <div className="mb-10 p-6 bg-rose-50 border border-rose-100 rounded-3xl flex items-center justify-between" data-bug-id={error.bugId}>
                                <div className="flex items-center gap-4">
                                    <span className="text-3xl text-rose-500">❌</span>
                                    <div>
                                        <p className="font-black text-rose-600 tracking-tight">강의 정보를 불러올 수 없습니다.</p>
                                        <p className="text-xs text-rose-400 font-bold">{error.message} (BugID: {error.bugId})</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {loading ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 opacity-50">
                                {[1, 2, 3, 4].map(i => <div key={i} className="h-40 bg-white rounded-3xl animate-pulse"></div>)}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {courses.map(c => (
                                    <div key={c.id} className="course-card p-8 flex flex-col justify-between">
                                        <div>
                                            <div className="flex justify-between items-start mb-4">
                                                <span className="bg-blue-50 text-blue-600 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">{c.category}</span>
                                                <span className="text-sm font-bold text-amber-500">★ {c.rating}</span>
                                            </div>
                                            <h3 className="text-xl font-black mb-2 leading-tight">{c.title}</h3>
                                            <p className="text-slate-400 text-xs font-bold uppercase">{c.instructor}</p>
                                        </div>
                                        <button className="mt-8 w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-black transition-all">강의 보기</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
