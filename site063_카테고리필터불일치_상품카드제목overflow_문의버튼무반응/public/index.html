<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>당근마켓 - 우리 동네 중고거래 마켓</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="header-left">
                    <div class="logo">
                        <span class="logo-icon">🥕</span>
                        <span class="logo-text">당근마켓</span>
                    </div>
                    <div class="region-selector">
                        <select id="region-select">
                            <option value="All">전체 지역</option>
                            <!-- Regions loaded here -->
                        </select>
                    </div>
                </div>
                <div class="header-center">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="물품이나 동네를 검색해보세요">
                        <button id="search-btn">🔍</button>
                    </div>
                </div>
                <div class="header-right">
                    <ul class="nav-menu">
                        <li><a href="#" class="active">중고거래</a></li>
                        <li><a href="#" onclick="alert('동네 생활 페이지 준비 중입니다.')">동네생활</a></li>
                        <li><a href="#" onclick="alert('알바 정보 페이지 준비 중입니다.')">알바</a></li>
                    </ul>
                    <div class="auth-btns">
                        <button class="btn-chat" onclick="alert('채팅 목록을 불러오는 중입니다.')">채팅</button>
                        <button class="btn-login" onclick="alert('로그인 페이지로 이동합니다.')">로그인</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-banner">
                    <div class="hero-text">
                        <h1>우리 동네 인기 매물</h1>
                        <p>지금 바로 당신의 이웃과 따뜻한 거래를 시작해보세요.</p>
                        <button class="btn-sell" onclick="alert('상품 등록 페이지 준비 중입니다.')">내 물건 판매하기</button>
                    </div>
                    <div class="hero-image">
                        <img src="https://images.unsplash.com/photo-1556740758-90de374c12ad?w=400&h=200&fit=crop" alt="Local Market">
                    </div>
                </div>
            </div>
        </section>

        <div class="container main-layout">
            <div class="content-area">
                <section class="filter-section">
                    <div class="category-chips" id="category-filters" data-bug-id="site063-bug01">
                        <button class="chip active" data-category="All">전체</button>
                        <button class="chip" data-category="Electronics">가전/디지털</button>
                        <button class="chip" data-category="Furniture">가구/인테리어</button>
                        <button class="chip" data-category="Clothing">의류</button>
                        <button class="chip" data-category="Books">도서</button>
                    </div>
                </section>

                <section class="item-grid-section">
                    <div id="item-grid" class="item-grid">
                        <div class="loading">매물을 불러오는 중...</div>
                    </div>
                </section>
            </div>

            <aside class="sidebar">
                <div class="sticky-panel">
                    <div class="safety-guide">
                        <h3>거래 안전 가이드</h3>
                        <ul>
                            <li>직거래 시에는 공공장소를 이용하세요.</li>
                            <li>너무 저렴한 매물은 주의하세요.</li>
                            <li>개인정보 공유를 최소화하세요.</li>
                        </ul>
                        <button class="btn-link" onclick="alert('상세 가이드 준비 중입니다.')">더 보기</button>
                    </div>
                    <div class="popular-keywords">
                        <h3>인기 검색어</h3>
                        <div class="keywords-list">
                            <span>#아이패드</span>
                            <span>#자전거</span>
                            <span>#캠핑의자</span>
                            <span>#에어팟</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">🥕 당근마켓</div>
                <ul class="footer-links">
                    <li><a href="#" onclick="alert('이용약관 안내입니다.')">이용약관</a></li>
                    <li><a href="#" onclick="alert('개인정보처리방침 안내입니다.')">개인정보처리방침</a></li>
                    <li><a href="#" onclick="alert('고객센터 연결 중입니다.')">고객센터</a></li>
                </ul>
            </div>
            <div class="footer-bottom">
                &copy; 2024 Danggeun Market Inc.
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
