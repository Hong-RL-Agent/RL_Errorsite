services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    restart: unless-stopped
    networks:
      - aura-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    networks:
      - aura-net

  nginx:
    image: nginx:1.27-alpine
    container_name: aura-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "9040:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aura-net

networks:
  aura-net:
    driver: bridge
