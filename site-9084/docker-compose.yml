services:
  backend:
    build:
      context: ./backend
    container_name: digital-heritage-backend-9084
    expose:
      - "9084"
    environment:
      SERVER_PORT: "9084"
      DIGITAL_HERITAGE_DR_SCENARIO: "ransomware-backup-encryption,rto-rpo-breach,cold-tape-damage"
    networks:
      - digital-heritage-9084

  frontend:
    build:
      context: ./frontend
    container_name: digital-heritage-frontend-9084
    depends_on:
      - backend
    ports:
      - "9084:9084"
    environment:
      DH_PUBLIC_BASE_URL: "http://localhost:9084"
      DH_DR_LOG_STREAM: "WAF_MISS,SIEM_FALSE_POSITIVE,NIGHT_SHIFT_DELAY,IRP_MISSING,BACKUP_ENCRYPTED"
    networks:
      - digital-heritage-9084

networks:
  digital-heritage-9084:
    name: digital-heritage-9084
    ipam:
      config:
        - subnet: 10.90.84.0/24
