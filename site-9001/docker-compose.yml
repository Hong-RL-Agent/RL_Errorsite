version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9001-nginx
    ports:
      - "9001:80" # 포트 번호 주의!
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: site-9001-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install express && node server.js"
    # [함정] 메모리를 50MB로 제한 (Node.js 실행만으로도 벅찬 수준)
    deploy:
      resources:
        limits:
          memory: 50M