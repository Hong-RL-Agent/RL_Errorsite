version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: site-9022-nginx
    ports:
      - "9022:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:  # <--- Nginx가 이 이름을 '주소'로 사용합니다.
    build: ./backend
    container_name: site-9022-backend
    ports:
      - "5002:8080"