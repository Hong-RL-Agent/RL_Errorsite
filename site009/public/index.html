<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop & Resell - site009</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: #050505; 
            color: #ffffff;
        }

        .neo-blue { color: #00f2ff; }
        .neo-blue-bg { background: #00f2ff; }
        .neo-blue-border { border-color: #00f2ff; }
        .neo-blue-shadow { box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); }

        .dark-card { 
            background: rgba(20, 20, 25, 0.8); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .syncopate { font-family: 'Syncopate', sans-serif; }

        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .graph-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease-out forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [products, setProducts] = useState([]);
            const [inventory, setInventory] = useState({ data: [], bids: [], settlement: 0 });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                try {
                    const [prodRes, invRes] = await Promise.all([
                        fetch('/api/products'),
                        fetch('/api/user/inventory')
                    ]);
                    const prodData = await prodRes.json();
                    const invData = await invRes.json();
                    
                    if (prodData.ok) setProducts(prodData.data);
                    if (invData.ok) setInventory(invData);
                } catch (err) {
                    setError("Failed to sync with market data");
                } finally {
                    setLoading(false);
                }
            };

            const notify = (msg, isError = false, bugId = null) => {
                setNotification({ msg, isError, bugId });
                setTimeout(() => setNotification(null), 4000);
            };

            const triggerAction = async (endpoint, body = {}) => {
                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    
                    if (data.ok) {
                        if (data.bugId) notify(`Vulnerability Detected: ${data.bugId}`, false, data.bugId);
                        else notify("Transaction completed");
                    } else {
                        if (data.bugId) notify(`Logic Paradox: ${data.bugId}`, true, data.bugId);
                        else notify(data.error || "Transaction failed", true);
                    }
                    fetchData();
                } catch (err) {
                    notify("Market connection error", true);
                }
            };

            if (loading) return (
                <div className="min-h-screen p-8 space-y-8 bg-[#050505]">
                    <div className="h-12 w-48 skeleton rounded-full"></div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {[1,2,3].map(i => <div key={i} className="h-96 skeleton rounded-3xl"></div>)}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    {/* Navigation */}
                    <nav className="p-6 px-10 border-b border-white/5 flex justify-between items-center sticky top-0 z-50 bg-[#050505]/80 backdrop-blur-md">
                        <div className="flex items-center gap-4">
                            <h1 className="syncopate text-2xl neo-blue tracking-tighter">SNEAKER DROP</h1>
                            <span className="text-[10px] font-bold bg-white/10 px-2 py-0.5 rounded text-white/40">v9.118</span>
                        </div>
                        <div className="flex gap-8 text-sm font-bold uppercase tracking-widest text-white/60">
                            <a href="#" className="hover:text-white transition-colors">Drops</a>
                            <a href="#" className="hover:text-white transition-colors">Market</a>
                            <a href="#" className="hover:text-white transition-colors">Vault</a>
                        </div>
                        <button onClick={() => triggerAction('/api/test/reset')} className="text-[10px] uppercase font-black text-white/20 hover:text-red-500">Reset Market</button>
                    </nav>

                    <main className="max-w-7xl mx-auto p-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
                        
                        {/* Market Drops */}
                        <div className="lg:col-span-8 space-y-10">
                            <div className="flex justify-between items-end">
                                <h2 className="text-4xl font-black italic uppercase">Live Drops</h2>
                                <div className="flex items-center gap-2 text-xs font-bold text-white/40">
                                    <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                                    Real-time Updates
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {products.map(p => (
                                    <div key={p.id} className="dark-card rounded-[2.5rem] p-8 hover:border-white/20 transition-all group relative overflow-hidden">
                                        <div className="absolute -top-10 -right-10 w-40 h-40 neo-blue-bg opacity-5 rounded-full blur-3xl group-hover:opacity-10 transition-opacity"></div>
                                        
                                        <div className="flex justify-between items-start mb-6">
                                            <span className="text-[10px] font-black uppercase bg-white/5 px-3 py-1 rounded-full text-white/60">{p.type}</span>
                                            <div className="text-right">
                                                <div className="text-xs text-white/40 font-bold">Market Price</div>
                                                <div className="text-xl font-black">₩{p.price.toLocaleString()}</div>
                                            </div>
                                        </div>

                                        <div className="w-full h-48 mb-8 flex items-center justify-center text-6xl opacity-20 grayscale group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500 transform group-hover:scale-110">
                                            👟
                                        </div>

                                        <h3 className="text-2xl font-bold mb-2 group-hover:neo-blue transition-colors">{p.name}</h3>
                                        <div className="text-sm font-medium text-white/40 mb-8">Stock Availability: <span className={p.stock <= 0 ? 'text-red-500' : 'text-white'}>{p.stock} units</span></div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <button 
                                                onClick={() => triggerAction('/api/order/buy', { productId: p.id })}
                                                className="bg-white text-black font-black py-4 rounded-2xl hover:neo-blue-bg transition-colors uppercase text-xs"
                                            >
                                                Instant Buy
                                            </button>
                                            <button 
                                                onClick={() => triggerAction('/api/order/bid', { productId: p.id, bidPrice: p.price - 10000 })}
                                                className="bg-white/5 text-white font-black py-4 rounded-2xl hover:bg-white/10 transition-colors uppercase text-xs"
                                            >
                                                Bid
                                            </button>
                                        </div>

                                        {/* Bug Triggers for this product */}
                                        <div className="mt-4 grid grid-cols-2 gap-2">
                                            {p.id === 1 && (
                                                <button 
                                                    data-bug-id="site009-bug01"
                                                    onClick={() => triggerAction('/api/order/buy', { productId: p.id, simulate_race: true })}
                                                    className="bg-red-900/40 text-red-400 font-bold py-2 rounded-xl text-[9px] uppercase border border-red-900/50 hover:bg-red-900"
                                                >
                                                    Race Condition Bug
                                                </button>
                                            )}
                                            {p.id === 1 && (
                                                <button 
                                                    data-bug-id="site009-bug02"
                                                    onClick={() => triggerAction('/api/order/bid', { productId: p.id, bidPrice: 200000 })}
                                                    className="bg-red-900/40 text-red-400 font-bold py-2 rounded-xl text-[9px] uppercase border border-red-900/50 hover:bg-red-900"
                                                >
                                                    Ambiguity Test
                                                </button>
                                            )}
                                            {p.id === 2 && (
                                                <button 
                                                    data-bug-id="site009-bug04"
                                                    onClick={() => triggerAction('/api/order/buy', { productId: p.id, discount: true })}
                                                    className="col-span-2 bg-red-900/40 text-red-400 font-bold py-2 rounded-xl text-[9px] uppercase border border-red-900/50 hover:bg-red-900"
                                                >
                                                    Business Paradox Bug
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Right Column: Inventory & Stats */}
                        <div className="lg:col-span-4 space-y-10">
                            
                            {/* Settlement Status */}
                            <section className="dark-card p-8 rounded-[2rem] neo-blue-shadow border-white/20">
                                <h3 className="text-xs font-black uppercase text-white/40 mb-4 tracking-widest">Market Settlement</h3>
                                <div className={`text-4xl font-black ${inventory.settlement < 0 ? 'text-red-500 animate-pulse' : 'text-white'}`}>
                                    ₩{inventory.settlement.toLocaleString()}
                                </div>
                                {inventory.settlement < 0 && (
                                    <div className="mt-2 text-[10px] font-black text-red-500 uppercase">Alert: Negative Settlement Paradox Detected</div>
                                )}
                            </section>

                            {/* My Inventory */}
                            <section className="dark-card p-8 rounded-[2rem]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-black uppercase italic">My Vault</h3>
                                    <span className="text-[10px] font-bold text-white/40">{inventory.data.length} Items</span>
                                </div>
                                
                                <div className="space-y-4">
                                    {inventory.data.length === 0 ? (
                                        <div className="py-10 text-center text-white/20 font-bold text-sm italic">Empty Vault</div>
                                    ) : (
                                        inventory.data.map((item, idx) => (
                                            <div key={idx} className="bg-white/5 p-4 rounded-2xl flex items-center gap-4 relative group">
                                                <div className="text-2xl">👟</div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-sm truncate">{item.name}</div>
                                                    <div className="text-[10px] text-white/40">OWNED # {item.orderId.toString().slice(-4)}</div>
                                                </div>
                                                <button 
                                                    data-bug-id="site009-bug03"
                                                    onClick={() => triggerAction('/api/order/buy', { productId: item.id, conflict: true })}
                                                    className="bg-red-500/10 text-red-500 px-3 py-1 rounded-lg text-[9px] font-black uppercase hover:bg-red-500 hover:text-white transition-all opacity-0 group-hover:opacity-100"
                                                >
                                                    Vanish Bug
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="mt-8 pt-8 border-t border-white/5 space-y-4">
                                    <h4 className="text-[10px] font-black uppercase text-white/40 tracking-widest">Active Bids</h4>
                                    {inventory.bids.map((bid, i) => (
                                        <div key={i} className="flex justify-between items-center text-xs">
                                            <span className="font-bold">Item ID {bid.productId}</span>
                                            <span className={`px-2 py-0.5 rounded font-black text-[9px] uppercase ${bid.status === null ? 'bg-red-500 text-white' : 'bg-white/10 text-white/60'}`}>
                                                {bid.status === null ? 'NULL_STATE' : bid.status}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* Market Graph Mock */}
                            <section className="dark-card p-8 rounded-[2rem] h-48 overflow-hidden relative">
                                <h3 className="text-xs font-black uppercase text-white/40 mb-4 tracking-widest">Volume Graph</h3>
                                <svg className="absolute bottom-0 left-0 w-full h-32" viewBox="0 0 400 100">
                                    <path 
                                        className="graph-line"
                                        d="M0,80 L50,70 L100,85 L150,40 L200,60 L250,20 L300,50 L350,10 L400,30" 
                                        fill="none" 
                                        stroke="#00f2ff" 
                                        strokeWidth="4"
                                    />
                                </svg>
                            </section>
                        </div>
                    </main>

                    {/* Neon Toast */}
                    {notification && (
                        <div className={`fixed bottom-10 right-10 p-6 px-10 rounded-2xl shadow-2xl z-50 transform transition-all duration-500 ${notification.isError ? 'bg-red-600' : 'bg-[#00f2ff] text-black'} neo-blue-shadow`}>
                            <div className="flex flex-col">
                                <span className="font-black italic uppercase text-lg tracking-tighter">{notification.msg}</span>
                                {notification.bugId && <span className="text-[10px] font-bold opacity-60 uppercase tracking-widest">Security Log: {notification.bugId}</span>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
