services:
  backend:
    build:
      context: ./backend
    container_name: orbit-hotel-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "18080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: orbit-hotel-frontend
    depends_on:
      - backend
    volumes:
      - frontend_dist:/app/dist

  nginx:
    image: nginx:1.25-alpine
    container_name: orbit-hotel-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "9047:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro

volumes:
  frontend_dist:
