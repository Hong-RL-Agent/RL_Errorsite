version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080"
    networks:
      - nebula-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80"
    networks:
      - nebula-network
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "9042:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nebula-network
    restart: unless-stopped

networks:
  nebula-network:
    driver: bridge
