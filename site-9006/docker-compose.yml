version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9006-nginx  # 9005 -> 9006으로 변경
    ports:
      - "9006:80"                  # 9005 -> 9006으로 변경 (에이전트 접속 포트)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: site-9006-backend # 9005 -> 9006으로 변경
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install express && node server.js"