services:
  vrfit-backend:
    build:
      context: ./backend
    container_name: vrfit-backend-9071
    environment:
      SERVER_PORT: "9071"
      VRFIT_CORS_ALLOWED_ORIGIN: "http://localhost:9071"
    expose:
      - "9071"

  vrfit-frontend:
    build:
      context: ./frontend
    container_name: vrfit-frontend-9071
    depends_on:
      - vrfit-backend
    ports:
      - "9071:80"
