name: DB-Error-Site-Deploy

on:
  push:
    branches: [ "db-network-security-errorsite" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd ~/RL_Errorsite
            git pull origin db-network-security-errorsite
            docker-compose up -d --build
            docker image prune -f