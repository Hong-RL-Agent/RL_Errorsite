services:
  robo-lab:
    build: .
    container_name: robo-lab-9070
    ports:
      - "9070:9070"
    environment:
      SERVER_PORT: "9070"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9070/actuator/health | grep UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
