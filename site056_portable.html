<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportHub Pro | 통합 데이터 자산 관리</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; }
        .sidebar { background-color: #ffffff; border-right: 1px solid #e5e7eb; width: 280px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 50; }
        .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 4px 16px; border-radius: 8px; color: #6b7280; cursor: pointer; transition: all 0.2s; font-weight: 500; font-size: 0.9rem; }
        .nav-link:hover { background-color: #f9fafb; color: #111827; }
        .nav-link.active { background-color: #eff6ff; color: #2563eb; font-weight: 600; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; }
        .badge-ready { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .btn-primary { background: #2563eb; color: #ffffff; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-outline { border: 1px solid #e5e7eb; color: #374151; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; background: white; }
        .btn-outline:hover { background: #f9fafb; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .page-content { animation: fadeIn 0.4s ease-out; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bug-toast { animation: slideDown 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: fixed; top: 20px; left: 55%; transform: translateX(-50%); z-index: 1000; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-ok { background: #10b981; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_REPORTS = [
            { id: 1, name: "Quarterly Financial Analysis Q1", status: "ready", size: "4.2 MB", date: "2026-05-01", url: "https://api.reporthub.com/v1/dl/q1_final" },
            { id: 2, name: "User Retention Metadata (Raw)", status: "pending", size: "12.8 MB", date: "2026-05-02", url: null },
            { id: 3, name: "System Load Test Comprehensive", status: "ready", size: "2.1 MB", date: "2026-05-03", url: null } // Bug 01
        ];

        function App() {
            const [view, setView] = useState('dashboard');
            const [reports, setReports] = useState(INITIAL_REPORTS);
            const [activeBug, setActiveBug] = useState(null);
            const [isExporting, setIsExporting] = useState(false);

            const triggerBug = (id) => {
                if (!id) return;
                setActiveBug(id);
                setTimeout(() => setActiveBug(null), 3000);
            };

            const handleCreate = () => {
                const newId = reports.length + 1;
                const newObj = { id: newId, name: `Custom Analysis Report #${newId}`, status: "ready", size: "1.5 MB", date: new Date().toISOString().split('T')[0], url: null };
                
                // Bug 03: Premature Ready
                setReports([newObj, ...reports]);
                triggerBug("site056-bug03");
            };

            const handleDownload = (id, options = {}) => {
                const report = reports.find(r => r.id === id);
                
                // Bug 02: Token Bypass Simulation via "Public Link"
                if (options.publicLink) {
                    triggerBug("site056-bug02");
                    alert("공개 링크를 통해 다운로드가 시작되었습니다.");
                    return;
                }

                if (report.status === "ready" && !report.url) {
                    // Bug 01: Status Desync
                    triggerBug("site056-bug01");
                    alert("서버 오류: 리포트 파일을 찾을 수 없습니다 (Error 404).");
                } else if (report.url) {
                    alert("리포트 다운로드를 준비 중입니다.");
                }
            };

            const handleBulkExport = () => {
                setIsExporting(true);
                setTimeout(() => {
                    // Bug 04: Stream Interruption
                    setIsExporting(false);
                    triggerBug("site056-bug04");
                    alert("다운로드 중단: 네트워크 연결이 불안정하여 스트림이 끊겼습니다.");
                }, 1500);
            };

            const renderContent = () => {
                switch(view) {
                    case 'dashboard':
                        return (
                            <div className="page-content">
                                <div className="flex justify-between items-center mb-10">
                                    <h1 className="text-2xl font-bold text-gray-900">운영 현황 대시보드</h1>
                                    <div className="flex items-center text-xs font-semibold text-gray-500">
                                        <span className="status-dot status-ok"></span> SYSTEM OPERATIONAL
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 gap-6 mb-10">
                                    <div className="card p-6">
                                        <p className="text-xs font-bold text-gray-400 uppercase mb-2">Total Reports</p>
                                        <p className="text-3xl font-bold">{reports.length}</p>
                                    </div>
                                    <div className="card p-6">
                                        <p className="text-xs font-bold text-gray-400 uppercase mb-2">Data Processed</p>
                                        <p className="text-3xl font-bold text-blue-600">84.2 GB</p>
                                    </div>
                                    <div className="card p-6">
                                        <p className="text-xs font-bold text-gray-400 uppercase mb-2">Avg. Speed</p>
                                        <p className="text-3xl font-bold">12.5 MB/s</p>
                                    </div>
                                    <div className="card p-6">
                                        <p className="text-xs font-bold text-gray-400 uppercase mb-2">Active Tasks</p>
                                        <p className="text-3xl font-bold text-emerald-600">3</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-8">
                                    <div className="card p-8">
                                        <h3 className="font-bold mb-4 text-gray-700">Quick Actions</h3>
                                        <div className="space-y-3">
                                            <button onClick={handleCreate} className="w-full btn-outline text-left flex justify-between items-center">
                                                <span>신규 분석 리포트 생성</span>
                                                <span className="text-gray-300">→</span>
                                            </button>
                                            <button onClick={handleBulkExport} className="w-full btn-outline text-left flex justify-between items-center">
                                                <span>전체 데이터 벌크 내보내기</span>
                                                <span className="text-gray-300">→</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="card p-8">
                                        <h3 className="font-bold mb-4 text-gray-700">Storage Usage</h3>
                                        <div className="w-full bg-gray-100 h-2 rounded-full mb-4">
                                            <div className="bg-blue-500 h-2 rounded-full" style={{width: '65%'}}></div>
                                        </div>
                                        <div className="flex justify-between text-xs font-semibold text-gray-400 uppercase">
                                            <span>650 GB Used</span>
                                            <span>1 TB Total</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'reports':
                        return (
                            <div className="page-content">
                                <div className="flex justify-between items-end mb-8">
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-900">리포트 관리 센터</h2>
                                        <p className="text-sm text-gray-500 mt-1">생성된 모든 분석 리포트의 상태를 관리하고 다운로드합니다.</p>
                                    </div>
                                    <button onClick={handleCreate} className="btn-primary">신규 리포트 생성</button>
                                </div>
                                <div className="card overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-gray-50 border-b border-gray-100 text-gray-400">
                                            <tr>
                                                <th className="p-4 text-[10px] font-bold uppercase">Report Name</th>
                                                <th className="p-4 text-[10px] font-bold uppercase">Status</th>
                                                <th className="p-4 text-[10px] font-bold uppercase">Size</th>
                                                <th className="p-4 text-[10px] font-bold uppercase">Created Date</th>
                                                <th className="p-4 text-[10px] font-bold uppercase text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-50">
                                            {reports.map(r => (
                                                <tr key={r.id} className="hover:bg-gray-50 transition-all">
                                                    <td className="p-4">
                                                        <p className="font-semibold text-gray-800 text-sm">{r.name}</p>
                                                        <p className="text-[10px] text-gray-400 font-mono">UID: {Math.random().toString(36).substr(2, 9).toUpperCase()}</p>
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`badge badge-${r.status}`}>{r.status.toUpperCase()}</span>
                                                    </td>
                                                    <td className="p-4 text-xs font-semibold text-gray-500">{r.size}</td>
                                                    <td className="p-4 text-xs text-gray-400">{r.date}</td>
                                                    <td className="p-4 text-right">
                                                        <button 
                                                            disabled={r.status === 'pending'}
                                                            onClick={() => handleDownload(r.id)}
                                                            className={`text-xs font-bold px-4 py-2 rounded-lg transition-all ${r.status === 'pending' ? 'text-gray-300' : 'text-blue-600 hover:bg-blue-50'}`}
                                                        >
                                                            DOWNLOAD
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        );
                    case 'sharing':
                        return (
                            <div className="page-content">
                                <h2 className="text-2xl font-bold mb-10 text-gray-900">외부 공유 설정</h2>
                                <div className="card p-10 max-w-2xl">
                                    <h3 className="font-bold text-gray-800 mb-2">Public Access Links</h3>
                                    <p className="text-sm text-gray-500 mb-8">보안 토큰 없이 외부에서 특정 리포트에 접근할 수 있는 링크를 관리합니다.</p>
                                    <div className="space-y-4">
                                        <div className="p-5 bg-gray-50 rounded-xl border border-gray-100 flex justify-between items-center">
                                            <div>
                                                <p className="text-sm font-bold text-gray-700">Financial Summary Q1 (Public)</p>
                                                <p className="text-[10px] text-gray-400 font-mono">Token-Free Access Enabled</p>
                                            </div>
                                            <button onClick={() => handleDownload(1, { publicLink: true })} className="btn-primary py-2 px-4 text-xs">Access Link</button>
                                        </div>
                                        <div className="p-5 bg-gray-50 rounded-xl border border-gray-100 flex justify-between items-center grayscale opacity-60">
                                            <div>
                                                <p className="text-sm font-bold text-gray-700">Raw Data Export (Expired)</p>
                                                <p className="text-[10px] text-gray-400 font-mono">Expired 2 days ago</p>
                                            </div>
                                            <button disabled className="btn-outline py-2 px-4 text-xs">Expired</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'audit':
                        return (
                            <div className="page-content">
                                <h2 className="text-2xl font-bold mb-10 text-gray-900">Audit Activity Logs</h2>
                                <div className="card overflow-hidden">
                                    <div className="bg-gray-50 p-4 border-b border-gray-100 flex gap-4 text-[10px] font-bold text-gray-400 uppercase">
                                        <span className="w-24">Timestamp</span>
                                        <span className="w-32">Event Type</span>
                                        <span>Description</span>
                                    </div>
                                    <div className="divide-y divide-gray-50 h-[500px] overflow-y-auto">
                                        {[
                                            { t: "10:05:22", e: "REPORT_GEN", d: "User 'admin' requested manual report generation." },
                                            { t: "10:01:45", e: "AUTH_BYPASS", d: "Security warning: Public access used for protected resource." },
                                            { t: "09:58:12", e: "SYS_HEALTH", d: "Database synchronization check completed successfully." },
                                            { t: "09:55:01", e: "STREAM_ERR", d: "Fatal: Data stream interrupted during bulk export." }
                                        ].map((l, i) => (
                                            <div key={i} className="p-4 flex gap-4 text-xs hover:bg-gray-50">
                                                <span className="w-24 font-mono text-gray-400">{l.t}</span>
                                                <span className={`w-32 font-bold ${l.e.includes('ERR') ? 'text-red-500' : l.e.includes('AUTH') ? 'text-purple-600' : 'text-blue-600'}`}>{l.e}</span>
                                                <span className="text-gray-600">{l.d}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="flex w-full min-h-screen">
                    {/* Bug Notification */}
                    {activeBug && (
                        <div className="bug-toast">
                            <div className="bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 font-mono font-bold text-xs border border-white/10">
                                <span className="text-blue-400">🛡️</span> bugid : {activeBug}
                            </div>
                        </div>
                    )}

                    {/* Sidebar */}
                    <aside className="sidebar flex flex-col py-10 shadow-sm">
                        <div className="flex items-center gap-3 mb-12 px-10">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-blue-200">R</div>
                            <h2 className="text-xl font-bold tracking-tight text-gray-900">ReportHub <span className="text-blue-600">Pro</span></h2>
                        </div>
                        <nav className="flex-1">
                            <div onClick={() => setView('dashboard')} className={`nav-link ${view === 'dashboard' ? 'active' : ''}`}>📊 <span>대시보드</span></div>
                            <div onClick={() => setView('reports')} className={`nav-link ${view === 'reports' ? 'active' : ''}`}>📂 <span>리포트 관리</span></div>
                            <div onClick={() => setView('sharing')} className={`nav-link ${view === 'sharing' ? 'active' : ''}`}>🔗 <span>외부 공유</span></div>
                            <div onClick={() => setView('audit')} className={`nav-link ${view === 'audit' ? 'active' : ''}`}>📑 <span>감사 로그</span></div>
                        </nav>
                        <div className="mt-auto px-10 py-6 border-t border-gray-50 text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                            Enterprise v2.4.1
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="main-content flex-1">
                        {renderContent()}
                        <footer className="mt-20 py-12 border-t border-gray-100 text-center text-[10px] font-black text-gray-300 uppercase tracking-[0.4em]">
                            © 2026 ReportHub Analytics • Confidential
                        </footer>
                    </main>

                    {/* Exporting Overlay */}
                    {isExporting && (
                        <div className="fixed inset-0 bg-black/20 backdrop-blur-sm z-[100] flex items-center justify-center">
                            <div className="card p-10 flex flex-col items-center bg-white shadow-2xl">
                                <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-6"></div>
                                <p className="font-bold text-gray-800">전체 데이터 내보내는 중...</p>
                                <p className="text-xs text-gray-400 mt-2">대용량 파일 스트리밍을 준비하고 있습니다.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
