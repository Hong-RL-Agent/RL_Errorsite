server:
  port: ${SERVER_PORT:9100}

spring:
  application:
    name: traffic-control-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/traffic_control}
    username: ${SPRING_DATASOURCE_USERNAME:traffic_ops}
    password: ${SPRING_DATASOURCE_PASSWORD:traffic_ops_pw}
    hikari:
      pool-name: TrafficControlLeakPronePool
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 900
      leak-detection-threshold: 1500
      max-lifetime: 30000

traffic-control:
  allowed-origins: ${TRAFFIC_CONTROL_ALLOWED_ORIGINS:http://localhost:9100,http://127.0.0.1:9100}
