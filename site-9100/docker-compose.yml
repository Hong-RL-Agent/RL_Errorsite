services:
  traffic-control-db:
    image: postgres:16-alpine
    container_name: traffic-control-db-9100
    environment:
      POSTGRES_DB: traffic_control
      POSTGRES_USER: traffic_ops
      POSTGRES_PASSWORD: traffic_ops_pw
    ports:
      - "55432:5432"
    volumes:
      - traffic-control-db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=24"
      - "-c"
      - "shared_buffers=32MB"
      - "-c"
      - "autovacuum=off"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=200ms"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_ops -d traffic_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  traffic-control-api:
    build:
      context: ./backend
    container_name: traffic-control-api-9100
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://traffic-control-db:5432/traffic_control
      SPRING_DATASOURCE_USERNAME: traffic_ops
      SPRING_DATASOURCE_PASSWORD: traffic_ops_pw
      TRAFFIC_CONTROL_ALLOWED_ORIGINS: http://localhost:9100,http://127.0.0.1:9100
    expose:
      - "8080"
    depends_on:
      traffic-control-db:
        condition: service_healthy

  traffic-control-web:
    build:
      context: ./frontend
    container_name: traffic-control-web-9100
    ports:
      - "9100:9100"
    depends_on:
      - traffic-control-api

  db-fault-log:
    image: alpine:3.20
    container_name: traffic-control-db-fault-log-9100
    command: >
      sh -c "while true; do
      echo '[TRAFFIC-CONTROL][DB-FAULT] lock_wait=critical pool_leak=suspected partitioning=missing disk=97% vacuum=stalled cache_hit=41% schema_migration=failed';
      sleep 8;
      done"
    depends_on:
      - traffic-control-db

volumes:
  traffic-control-db-data:

networks:
  default:
    name: traffic-control-9100-net
    ipam:
      config:
        - subnet: 10.91.0.0/24
