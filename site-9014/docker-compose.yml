version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9014-nginx
    ports:
      - "9014:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: site-9014-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install express && node server.js"