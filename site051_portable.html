<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Gallery | 지능형 이미지 매니지먼트</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; margin: 0; }
        .sidebar { background-color: #fcfcfc; border-right: 1px solid #eeeeee; width: 260px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 50; }
        .main-content { margin-left: 260px; padding: 48px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 14px 20px; margin: 4px 16px; border-radius: 12px; color: #666666; text-decoration: none; transition: all 0.2s; font-weight: 500; font-size: 0.95rem; }
        .nav-link:hover { background-color: #f5f5f5; color: #000000; }
        .section-anchor { padding-top: 60px; margin-bottom: 100px; }
        .card { background: white; border: 1px solid #efefef; border-radius: 16px; overflow: hidden; transition: all 0.3s cubic-bezier(0.2, 0, 0, 1); }
        .card-interactive { cursor: pointer; }
        .card-interactive:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .badge { padding: 5px 12px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-ready { background: #ecfdf5; color: #059669; }
        .badge-processing { background: #fffbeb; color: #d97706; }
        .tag-chip { background: #f3f4f6; padding: 4px 12px; border-radius: 100px; font-size: 0.75rem; color: #4b5563; font-weight: 600; }
        .btn-black { background: #000000; color: #ffffff; padding: 14px 28px; border-radius: 12px; font-weight: 700; transition: all 0.2s; }
        .btn-black:hover { transform: translateY(-2px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bug-toast { animation: slideDown 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: fixed; top: 24px; left: 55%; transform: translateX(-50%); z-index: 1000; }
        .path-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_IMAGES = [
            { id: 1, name: "alps_winter.jpg", size: -1540, status: "ready", thumbnailUrl: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400&h=300&fit=crop", path: "/storage/v1/alps_winter.jpg" },
            { id: 2, name: "manhattan_night.png", size: 4200, status: "ready", thumbnailUrl: null, path: "/storage/v1/manhattan_night.png" },
            { id: 3, name: "abstract_vector.webp", size: 720, status: "ready", thumbnailUrl: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400&h=300&fit=crop", path: "/storage/v1/abstract_vector.webp" }
        ];

        function App() {
            const [images, setImages] = useState(INITIAL_IMAGES);
            const [activeBug, setActiveBug] = useState(null);
            const [showIntegrity, setShowIntegrity] = useState(false);

            const triggerBug = (id) => {
                if (!id) return;
                setActiveBug(id);
                setTimeout(() => setActiveBug(null), 3000);
            };

            const handleUpload = (e) => {
                e.preventDefault();
                const name = e.target.filename.value || "upload_file.jpg";
                const newId = Date.now();
                const item1 = { id: newId, name, size: 2048, status: "processing", path: "/tmp/uploading.jpg" };
                const item2 = { id: newId, name, size: 2048, status: "ready", path: "/storage/v1/ready.jpg" };
                setImages([...images, item1, item2]);
                triggerBug("site051-bug02");
                e.target.reset();
            };

            const toggleIntegrity = () => {
                setShowIntegrity(!showIntegrity);
                if (!showIntegrity) {
                    setImages(prev => prev.map(img => {
                        if (img.id === 1) return { ...img, path: "/storage/v1/abstract_vector.webp" };
                        if (img.id === 3) return { ...img, path: "/storage/v1/alps_winter.jpg" };
                        return img;
                    }));
                    triggerBug("site051-bug04");
                } else {
                    setImages(INITIAL_IMAGES);
                }
            };

            return (
                <div className="flex w-full min-h-screen">
                    {/* Bug Notification */}
                    {activeBug && (
                        <div className="bug-toast">
                            <div className="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 font-mono font-bold text-xs border border-white/10">
                                <span className="text-white">📸</span> bugid : {activeBug}
                            </div>
                        </div>
                    )}

                    {/* Sidebar */}
                    <aside className="sidebar flex flex-col py-10">
                        <div className="flex items-center gap-3 mb-16 px-8">
                            <div className="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg">S</div>
                            <h2 className="text-xl font-black tracking-tight uppercase">Stellar</h2>
                        </div>
                        <nav className="flex-1 space-y-1">
                            <a href="#dashboard" className="nav-link">🏠 <span>대시보드 요약</span></a>
                            <a href="#gallery" className="nav-link">🖼️ <span>이미지 갤러리</span></a>
                            <a href="#upload" className="nav-link">☁️ <span>신규 업로드</span></a>
                            <a href="#gallery" onClick={toggleIntegrity} className="nav-link">🔍 <span>에셋 무결성 검사</span></a>
                        </nav>
                        <div className="mt-auto px-8 text-[10px] text-gray-300 font-bold uppercase tracking-[0.2em]">
                            Gallery Control • site051
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="main-content flex-1">
                        
                        <section id="dashboard" className="section-anchor">
                            <h1 className="text-4xl font-black mb-12 tracking-tight">라이브러리 통계</h1>
                            <div className="grid grid-cols-3 gap-8">
                                <div className="card p-10 bg-neutral-50 border-none">
                                    <p className="text-[10px] font-black text-neutral-400 uppercase tracking-widest mb-3">총 이미지 수</p>
                                    <p className="text-5xl font-black text-neutral-900">{images.length} <span className="text-xl font-bold text-neutral-300 ml-1">장</span></p>
                                </div>
                                <div className="card p-10 bg-neutral-50 border-none">
                                    <p className="text-[10px] font-black text-neutral-400 uppercase tracking-widest mb-3">사용된 용량</p>
                                    <p className="text-5xl font-black text-neutral-900">24.8 <span className="text-xl font-bold text-neutral-300 ml-1">MB</span></p>
                                </div>
                                <div className="card p-10 bg-neutral-50 border-none">
                                    <p className="text-[10px] font-black text-neutral-400 uppercase tracking-widest mb-3">서버 상태</p>
                                    <p className="text-5xl font-black text-emerald-500">Normal</p>
                                </div>
                            </div>
                        </section>

                        <section id="gallery" className="section-anchor">
                            <div className="flex justify-between items-end mb-10">
                                <div>
                                    <h2 className="text-3xl font-black mb-2 tracking-tight">이미지 갤러리</h2>
                                    <p className="text-sm text-neutral-400">라이브러리에 저장된 모든 에셋을 관리합니다.</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-10">
                                {images.map((img, idx) => {
                                    // Image 1 and 2 are now clickable for different bugs
                                    const isClickable = img.id === 1 || img.id === 2;
                                    return (
                                        <div 
                                            key={idx} 
                                            className={`card border-none shadow-sm ${isClickable ? 'card-interactive' : 'cursor-default'}`} 
                                            onClick={() => {
                                                if (img.id === 1) triggerBug("site051-bug01");
                                                if (img.id === 2) triggerBug("site051-bug03");
                                            }}
                                        >
                                            <div className="relative overflow-hidden bg-neutral-100">
                                                {img.thumbnailUrl ? (
                                                    <img src={img.thumbnailUrl} className="w-full aspect-[4/3] object-cover filter grayscale transition-all duration-700 hover:grayscale-0" alt={img.name} />
                                                ) : (
                                                    <div className="w-full aspect-[4/3] flex flex-col items-center justify-center gap-3 text-neutral-300 bg-neutral-50">
                                                        <span className="text-3xl">🕳️</span>
                                                        <span className="text-[10px] font-bold uppercase tracking-widest text-neutral-400">Image Load Failed</span>
                                                    </div>
                                                )}
                                                <div className="absolute top-4 left-4">
                                                    <span className={`badge ${img.status === 'ready' ? 'badge-ready' : 'badge-processing'}`}>
                                                        {img.status}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="p-8">
                                                <div className="flex justify-between items-start mb-4">
                                                    <h4 className="font-bold text-base text-neutral-900 truncate pr-4">{img.name}</h4>
                                                    <p className={`font-mono text-xs font-bold ${img.size < 0 ? 'text-red-500 underline decoration-2' : 'text-neutral-400'}`}>
                                                        {img.size} KB
                                                    </p>
                                                </div>
                                                
                                                {showIntegrity && (
                                                    <div className="mb-6 p-3 bg-red-50 rounded-lg border border-red-100 animate-pulse">
                                                        <p className="text-[10px] font-black text-red-400 uppercase mb-1">Internal Path Mismatch</p>
                                                        <p className="path-label font-bold text-red-600 truncate">{img.path}</p>
                                                    </div>
                                                )}
                                                
                                                <div className="flex gap-2">
                                                    <span className="tag-chip">#v1_stable</span>
                                                    <span className="tag-chip">#id_{img.id}</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </section>

                        <section id="upload" className="section-anchor">
                            <h2 className="text-3xl font-black mb-8 tracking-tight">이미지 업로드</h2>
                            <div className="card p-16 border-2 border-dashed border-neutral-200 bg-white flex flex-col items-center text-center shadow-sm">
                                <div className="w-24 h-24 bg-neutral-50 rounded-3xl flex items-center justify-center text-4xl mb-8 shadow-inner">☁️</div>
                                <h3 className="text-2xl font-black mb-3">새로운 에셋을 추가하세요</h3>
                                <p className="text-neutral-400 mb-10 max-w-sm leading-relaxed">
                                    고해상도 이미지를 안전하게 업로드하고<br />비동기 썸네일 생성을 시작합니다.
                                </p>
                                <form onSubmit={handleUpload} className="w-full max-w-md flex gap-4">
                                    <input name="filename" required className="flex-1 bg-neutral-50 p-5 rounded-2xl outline-none focus:ring-4 focus:ring-black/5 transition-all border border-neutral-100 font-bold" placeholder="파일명 (예: portfolio_01.jpg)" />
                                    <button type="submit" data-bug-id="site051-bug02" className="btn-black">
                                        UPLOAD
                                    </button>
                                </form>
                            </div>
                        </section>

                        <footer className="mt-20 py-12 border-t border-neutral-100 text-center text-[10px] font-black text-neutral-300 uppercase tracking-[0.3em]">
                            Stellar Image Control Hub • site051 • 2026
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
