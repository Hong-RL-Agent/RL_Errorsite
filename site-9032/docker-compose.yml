version: '3.8'
services:
  nginx-9032:
    image: nginx:stable-alpine
    container_name: jaws-nginx-9032
    ports:
      - "9032:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend-9032
    networks:
      - jaws-network

  backend-9032:
    build: ./backend
    container_name: jaws-backend-9032
    networks:
      - jaws-network

networks:
  jaws-network:
    driver: bridge