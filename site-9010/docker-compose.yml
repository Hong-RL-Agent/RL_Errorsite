version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9010-nginx
    ports:
      - "9010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: site-9010-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    # npm install 시 이름이 겹치는 패키지가 외부(npm)에서 설치되었다고 가정
    command: sh -c "npm install express && node server.js"