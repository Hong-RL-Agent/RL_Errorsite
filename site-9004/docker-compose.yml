version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9004-nginx
    ports:
      - "9004:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: site-9004-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install express && node server.js"
    environment:
      - PORT=5001
      # [함정] 필수 변수를 누락시킵니다. 에이전트가 이 파일을 보고 찾아내야 합니다.
      # - CRYPTO_SECRET_KEY=jaws_secret_2026