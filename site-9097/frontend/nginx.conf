server {
  listen 9097;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-WM-Console "WASTE-MGMT-9097" always;

  location /api/ {
    proxy_pass http://waste-backend:9097/api/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:9097;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-WM-Proxy-Trace "nginx-9097";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
