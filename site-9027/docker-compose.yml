services:
  nginx:
    image: nginx:alpine
    container_name: site-9027-nginx
    ports:
      - "9027:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: site-9027-backend
    ports:
      - "5009:8080"