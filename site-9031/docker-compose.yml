services:
  backend:
    build:
      context: ./backend
    container_name: site-9031-backend
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: site-9031-frontend
    expose:
      - "5173"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: site-9031-nginx
    ports:
      - "9031:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
