<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaleWise | 쿠폰 및 프로모션 관리</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #fcfcfc; color: #1a1a1a; margin: 0; overflow-x: hidden; }
        .sidebar { background-color: #ffffff; border-right: 1px solid #eeeeee; width: 280px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 50; }
        .main-content { margin-left: 280px; padding: 48px; min-height: 100vh; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 20px; margin: 4px 16px; border-radius: 12px; color: #666666; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .nav-link:hover { background-color: #fff1f1; color: #d90429; }
        .nav-link.active { background-color: #d90429; color: white; }
        .card { background: white; border: 1px solid #efefef; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .badge { padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
        .badge-red { background: #fee2e2; color: #b91c1c; }
        .badge-gray { background: #f3f4f7; color: #4b5563; }
        .btn-red { background: #d90429; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 700; transition: all 0.2s; }
        .btn-red:hover { background: #ef233c; transform: scale(1.02); }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .page-transition { animation: slideIn 0.3s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bug-toast { animation: slideDown 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: fixed; top: 24px; left: 55%; transform: translateX(-50%); z-index: 1000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MOCK_COUPONS = [
            { id: 1, code: "WELCOME10", discount: 10, minAmount: 10000, expired: false, description: "첫 주문 환영 10% 할인 (1만원 이상)" },
            { id: 2, code: "VIPSALE20", discount: 20, minAmount: 50000, expired: false, description: "VIP 전용 20% 특별 세일" },
            { id: 3, code: "OFF5000", discount: 5, minAmount: 0, expired: true, description: "시즌 오프 만료 쿠폰" }
        ];

        function App() {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [activeBug, setActiveBug] = useState(null);
            const [applied, setApplied] = useState([]);
            const [orderAmount, setOrderAmount] = useState(8000);

            const triggerBug = (id) => {
                if (!id) return;
                setActiveBug(id);
                setTimeout(() => setActiveBug(null), 3000);
            };

            const applyCoupon = (coupon) => {
                let bug = null;
                if (coupon.expired) bug = "site052-bug04";
                if (orderAmount < coupon.minAmount) bug = "site052-bug02";
                if (applied.some(c => c.id === coupon.id)) bug = "site052-bug01";

                setApplied([...applied, coupon]);
                triggerBug(bug);
            };

            const calculateTotalDiscount = () => {
                const base = applied.reduce((sum, c) => sum + (orderAmount * (c.discount / 100)), 0);
                return Math.floor(base * 1.5); // Bug 03 logic
            };

            const renderPage = () => {
                switch(currentPage) {
                    case 'dashboard':
                        return (
                            <div className="page-transition">
                                <h1 className="text-4xl font-black mb-12 tracking-tight">프로모션 대시보드</h1>
                                <div className="grid grid-cols-3 gap-8">
                                    <div className="card p-10 border-l-8 border-red-500">
                                        <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">활성 쿠폰</p>
                                        <p className="text-5xl font-black text-slate-900">12 <span className="text-xl font-bold text-gray-300 ml-1">종</span></p>
                                    </div>
                                    <div className="card p-10 border-l-8 border-yellow-500">
                                        <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">현재 적용 건수</p>
                                        <p className="text-5xl font-black text-slate-900">{applied.length} <span className="text-xl font-bold text-gray-300 ml-1">건</span></p>
                                    </div>
                                    <div className="card p-10 border-l-8 border-emerald-500">
                                        <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">예상 절감액</p>
                                        <p className="text-5xl font-black text-emerald-600">₩{calculateTotalDiscount().toLocaleString()}</p>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'coupons':
                        return (
                            <div className="page-transition">
                                <h2 className="text-3xl font-black mb-8 tracking-tight">쿠폰 보관함</h2>
                                <div className="grid grid-cols-1 gap-6 max-w-4xl">
                                    {MOCK_COUPONS.map(c => (
                                        <div key={c.id} className="card flex items-center overflow-hidden">
                                            <div className="bg-red-50 p-10 flex flex-col items-center justify-center min-w-[180px] border-r-2 border-dashed border-red-200">
                                                <p className="text-3xl font-black text-red-600">{c.discount}%</p>
                                                <p className="text-[10px] font-bold text-red-400 uppercase tracking-widest">OFF</p>
                                            </div>
                                            <div className="p-8 flex-1 flex justify-between items-center">
                                                <div>
                                                    <div className="flex items-center gap-3 mb-2">
                                                        <span className="font-black text-xl text-slate-800">{c.code}</span>
                                                        <span className={`badge ${c.expired ? 'badge-gray' : 'badge-red'}`}>{c.expired ? '만료됨' : '사용 가능'}</span>
                                                    </div>
                                                    <p className="text-slate-500 font-medium">{c.description}</p>
                                                </div>
                                                <button onClick={() => applyCoupon(c)} className="btn-red">적용하기</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    case 'orders':
                        return (
                            <div className="page-transition">
                                <h2 className="text-3xl font-black mb-8 tracking-tight">주문 설정 및 확인</h2>
                                <div className="card p-12 max-w-2xl bg-slate-50 border-2 border-dashed border-slate-200">
                                    <div className="space-y-8">
                                        <div>
                                            <label className="block text-sm font-black text-slate-500 mb-4 uppercase tracking-widest">실시간 주문 금액 설정</label>
                                            <div className="flex items-center gap-4">
                                                <input 
                                                    type="number" 
                                                    value={orderAmount}
                                                    onChange={(e) => setOrderAmount(parseInt(e.target.value))}
                                                    className="flex-1 bg-white p-6 rounded-2xl border border-slate-200 outline-none focus:ring-4 focus:ring-red-100 transition-all font-black text-3xl text-red-600" 
                                                />
                                                <span className="text-2xl font-black text-slate-400">원</span>
                                            </div>
                                        </div>
                                        <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-inner">
                                            <p className="font-bold text-slate-400 mb-2">적용된 쿠폰 리스트</p>
                                            <div className="space-y-2">
                                                {applied.map((c, i) => (
                                                    <div key={i} className="flex justify-between font-black text-slate-800 border-b border-slate-50 pb-2">
                                                        <span>{c.code}</span>
                                                        <span>{c.discount}%</span>
                                                    </div>
                                                ))}
                                                {applied.length === 0 && <p className="text-slate-300 italic">적용된 쿠폰이 없습니다.</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'summary':
                        return (
                            <div className="page-transition">
                                <h2 className="text-3xl font-black mb-10 tracking-tight text-red-600">최종 결제 요약</h2>
                                <div className="card p-12 max-w-4xl bg-slate-900 text-white overflow-hidden relative shadow-2xl shadow-red-100">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-red-600/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                                    <div className="space-y-10 relative z-10">
                                        <div className="flex justify-between items-center text-2xl text-slate-400 font-bold border-b border-slate-800 pb-8">
                                            <span>주문 총액</span>
                                            <span>₩{orderAmount.toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-3xl text-red-400 font-black">
                                            <span>총 할인 적용액</span>
                                            <span data-bug-id="site052-bug03">- ₩{calculateTotalDiscount().toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-5xl font-black pt-10 border-t-4 border-slate-800">
                                            <span>실제 결제 금액</span>
                                            <span className="text-emerald-400">₩{(orderAmount - calculateTotalDiscount()).toLocaleString()}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="flex w-full min-h-screen">
                    {/* Bug Notification */}
                    {activeBug && (
                        <div className="bug-toast">
                            <div className="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 font-mono font-bold text-xs border border-white/10">
                                <span className="text-red-400">🎫</span> bugid : {activeBug}
                            </div>
                        </div>
                    )}

                    {/* Sidebar */}
                    <aside className="sidebar flex flex-col py-10">
                        <div className="flex items-center gap-3 mb-16 px-10">
                            <div className="w-12 h-12 bg-red-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-xl">S</div>
                            <h2 className="text-2xl font-black tracking-tighter">SaleWise</h2>
                        </div>
                        <nav className="flex-1">
                            <div onClick={() => setCurrentPage('dashboard')} className={`nav-link ${currentPage === 'dashboard' ? 'active' : ''}`}>🏠 <span>대시보드</span></div>
                            <div onClick={() => setCurrentPage('coupons')} className={`nav-link ${currentPage === 'coupons' ? 'active' : ''}`}>🎫 <span>쿠폰 보관함</span></div>
                            <div onClick={() => setCurrentPage('orders')} className={`nav-link ${currentPage === 'orders' ? 'active' : ''}`}>🛒 <span>주문 확인</span></div>
                            <div onClick={() => { setCurrentPage('summary'); triggerBug("site052-bug03"); }} className={`nav-link ${currentPage === 'summary' ? 'active' : ''}`}>📉 <span>최종 결제 요약</span></div>
                        </nav>
                        <div className="mt-auto px-10 text-[10px] text-gray-400 font-bold uppercase tracking-widest border-t border-gray-50 pt-8">
                            Promotion Hub • site052
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="main-content flex-1 bg-[#fdfdfd]">
                        {renderPage()}
                        <footer className="mt-20 py-12 text-center text-[10px] font-black text-gray-300 uppercase tracking-[0.3em]">
                            © 2026 SaleWise Intelligence System
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
