version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: site-9002-nginx
    ports:
      - "9002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: site-9002-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      # [함정 포인트] 파일이 저장될 외부 폴더 연결
      - ./uploads:/app/uploads 
    command: sh -c "npm install express multer && node server.js"
    environment:
      - PORT=5001