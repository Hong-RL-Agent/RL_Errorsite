server:
  port: 8080

spring:
  application:
    name: vita-link-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

vita:
  dirty-threshold: ${VITA_DIRTY_THRESHOLD:4}
  dirty-writeback-ms: ${VITA_DIRTY_WRITEBACK_MS:2000}
  numa-latency-ms: ${VITA_NUMA_LATENCY_MS:350}
  irq-freeze-ms: ${VITA_IRQ_FREEZE_MS:500}
  cpu-jitter-min-ms: ${VITA_CPU_JITTER_MIN_MS:50}
  cpu-jitter-max-ms: ${VITA_CPU_JITTER_MAX_MS:100}
  noisy-neighbor-enabled: ${VITA_NOISY_NEIGHBOR_ENABLED:true}
  noisy-neighbor-period-ms: ${VITA_NOISY_NEIGHBOR_PERIOD_MS:9000}
  noisy-neighbor-spin-ms: ${VITA_NOISY_NEIGHBOR_SPIN_MS:700}
  avx-downclock-ms: ${VITA_AVX_DOWNCLOCK_MS:5000}
  smi-probability: ${VITA_SMI_PROBABILITY:0.08}
  smi-latency-ms: ${VITA_SMI_LATENCY_MS:200}
  oom-enabled: ${VITA_OOM_ENABLED:true}
  oom-tick-ms: ${VITA_OOM_TICK_MS:2500}
  oom-increment-percent: ${VITA_OOM_INCREMENT_PERCENT:7}
  cow-buffer-mb: ${VITA_COW_BUFFER_MB:128}
  cow-threads: ${VITA_COW_THREADS:8}
