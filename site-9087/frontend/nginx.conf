server {
  listen 9087;
  server_name localhost;

  access_log /var/log/ai-trans/browser-policy.log;
  error_log /var/log/nginx/ai-trans-error.log warn;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:9087 http://localhost:9087; img-src 'self' data:; font-src 'self' data:;" always;
  add_header X-AI-TRANS-Policy "strict-csp-cors-training" always;

  location /api/ {
    proxy_pass http://backend:9088/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass http://backend:9088/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}

