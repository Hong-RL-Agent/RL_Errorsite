log_format perf '$remote_addr - $request_time "$request" $status $body_bytes_sent '
                '"$http_user_agent" "$http_sec_fetch_site" "$http_sec_fetch_mode"';

server {
  listen 80;
  server_name localhost;

  access_log /var/log/nginx/smart-escrow-performance.log perf;
  error_log /var/log/nginx/smart-escrow-error.log warn;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location /sw.js {
    add_header Cache-Control "max-age=31536000, immutable";
    try_files $uri =404;
  }
}
