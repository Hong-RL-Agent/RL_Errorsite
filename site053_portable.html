<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLink | 지능형 재고 통합 관제</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8f9fa; color: #212529; margin: 0; }
        .sidebar { background-color: #0d1b2a; color: #ffffff; width: 260px; height: 100vh; position: fixed; left: 0; top: 0; z-index: 50; }
        .main-content { margin-left: 260px; padding: 48px; min-height: 100vh; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 14px 24px; margin: 4px 16px; border-radius: 12px; color: #a0a4a8; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .nav-link:hover { background-color: #1b263b; color: #ffffff; }
        .nav-link.active { background-color: #3e5c76; color: #ffffff; }
        .card { background: white; border: 1px solid #e9ecef; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .status-badge { padding: 4px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; }
        .badge-safe { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #ffedd5; color: #9a3412; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .btn-primary { background: #1b263b; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 700; transition: all 0.2s; }
        .btn-primary:hover { background: #0d1b2a; transform: translateY(-2px); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .page-content { animation: fadeIn 0.3s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bug-toast { animation: slideDown 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: fixed; top: 24px; left: 55%; transform: translateX(-50%); z-index: 1000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_PRODUCTS = [
            { id: 1, name: "고성능 그래픽카드 RTX 4090", stock: 15, price: 2500000 },
            { id: 2, name: "기계식 키보드 청축", stock: 8, price: 120000 },
            { id: 3, name: "4K 모니터 32인치", stock: 3, price: 850000 }
        ];

        function App() {
            const [view, setView] = useState('dashboard');
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [orders, setOrders] = useState([]);
            const [activeBug, setActiveBug] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);

            const triggerBug = (id) => {
                if (!id) return;
                setActiveBug(id);
                setTimeout(() => setActiveBug(null), 3000);
            };

            const syncGlobalInventory = () => {
                setIsSyncing(true);
                setTimeout(() => {
                    setProducts(prev => prev.map(p => {
                        if (p.id === 1) return { ...p, stock: 15 };
                        return p;
                    }));
                    triggerBug("site053-bug01");
                    setIsSyncing(false);
                }, 1000);
            };

            const processBulkOrders = async () => {
                setIsSyncing(true);
                const currentStock = products[0].stock;
                const newOrders = Array.from({length: 5}).map((_, i) => ({
                    id: orders.length + i + 1,
                    productName: products[0].name,
                    quantity: 1,
                    time: new Date().toLocaleTimeString()
                }));

                setTimeout(() => {
                    setOrders([...newOrders, ...orders]);
                    setProducts(prev => prev.map(p => {
                        if (p.id === 1) return { ...p, stock: currentStock - 1 };
                        return p;
                    }));
                    triggerBug("site053-bug03");
                    setIsSyncing(false);
                }, 800);
            };

            const createOrder = (productId, quantity) => {
                const product = products.find(p => p.id === productId);
                let bugId = null;
                if (quantity > product.stock) bugId = "site053-bug02";
                const isAtomicFailure = Math.random() < 0.3;
                if (isAtomicFailure) bugId = "site053-bug04";
                const newOrder = { id: orders.length + 1, productName: product.name, quantity, time: new Date().toLocaleTimeString() };
                setOrders([newOrder, ...orders]);
                if (!isAtomicFailure) {
                    setProducts(prev => prev.map(p => (p.id === productId ? { ...p, stock: p.stock - quantity } : p)));
                }
                triggerBug(bugId);
            };

            const renderContent = () => {
                switch(view) {
                    case 'dashboard':
                        return (
                            <div className="page-content">
                                <h1 className="text-4xl font-black mb-10 tracking-tight text-slate-800">운영 컨트롤 센터</h1>
                                <div className="grid grid-cols-2 gap-8 mb-10">
                                    <div className="card p-10 border-l-8 border-slate-900">
                                        <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">전체 SKU</p>
                                        <p className="text-5xl font-black text-slate-900">{products.length}</p>
                                    </div>
                                    <div className="card p-10 border-l-8 border-orange-500">
                                        <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">미결제 주문</p>
                                        <p className="text-5xl font-black text-orange-600">{orders.length}</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-8">
                                    <div className="card p-8">
                                        <h3 className="text-xl font-black mb-6">주문 처리</h3>
                                        <button 
                                            onClick={processBulkOrders}
                                            className="w-full bg-orange-600 text-white py-6 rounded-2xl font-black hover:bg-orange-700 transition-all shadow-xl shadow-orange-100"
                                        >
                                            {isSyncing ? '주문 처리 중...' : '5건 주문 즉시 일괄 처리'}
                                        </button>
                                    </div>
                                    <div className="card p-8 overflow-hidden">
                                        <h3 className="text-xl font-black mb-6">실시간 처리 로그</h3>
                                        <div className="space-y-4">
                                            {orders.slice(0, 3).map(o => (
                                                <div key={o.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                    <div><p className="font-bold text-sm">#ORD-{o.id}</p><p className="text-[10px] text-gray-400 font-mono">{o.productName}</p></div>
                                                    <span className="font-black text-slate-900">{o.quantity} EA</span>
                                                </div>
                                            ))}
                                            {orders.length === 0 && <p className="text-center py-10 text-gray-300 italic">로그가 비어 있습니다.</p>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    case 'products':
                        return (
                            <div className="page-content">
                                <div className="flex justify-between items-center mb-10">
                                    <h2 className="text-3xl font-black tracking-tight text-slate-800">재고 마스터 관리</h2>
                                    <button 
                                        onClick={syncGlobalInventory}
                                        className="bg-slate-900 text-white px-8 py-4 rounded-xl font-bold hover:bg-slate-800 shadow-lg"
                                    >
                                        {isSyncing ? '동기화 중...' : '전역 재고 데이터 동기화'}
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {products.map(p => (
                                        <div key={p.id} className="card p-8 flex justify-between items-center group hover:border-slate-300 transition-all">
                                            <div className="flex gap-10 items-center">
                                                <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center text-2xl shadow-inner">📦</div>
                                                <div>
                                                    <div className="flex items-center gap-4 mb-2">
                                                        <span className="font-black text-xl text-slate-800">{p.name}</span>
                                                        {p.stock <= 0 ? <span className="badge-danger status-badge">품절</span> : p.stock < 5 ? <span className="badge-warning status-badge">재고부족</span> : <span className="badge-safe status-badge">정상</span>}
                                                    </div>
                                                    <p className="text-sm font-bold text-gray-400 uppercase tracking-tighter">SKU_ID: 000{p.id} | UNIT PRICE: ₩{p.price.toLocaleString()}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-10">
                                                <div className="text-right">
                                                    <p className="text-[10px] font-black text-gray-300 uppercase">Current Stock</p>
                                                    <p className={`text-3xl font-black ${p.stock < 0 ? 'text-red-600 underline' : 'text-slate-900'}`}>{p.stock} <span className="text-sm font-medium text-gray-300">EA</span></p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => createOrder(p.id, 1)} className="btn-primary">낱개 주문</button>
                                                    <button onClick={() => createOrder(p.id, 20)} className="bg-red-50 text-red-600 px-6 py-4 rounded-xl font-black hover:bg-red-100 border border-red-200">초과 주문</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );
                    case 'orders':
                        return (
                            <div className="page-content">
                                <h2 className="text-3xl font-black mb-10 tracking-tight">주문 트랜잭션 내역</h2>
                                <div className="card overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-slate-900 text-white">
                                            <tr>
                                                <th className="p-6 text-[10px] font-black uppercase tracking-widest">Transaction ID</th>
                                                <th className="p-6 text-[10px] font-black uppercase tracking-widest">Asset Name</th>
                                                <th className="p-6 text-[10px] font-black uppercase tracking-widest">Quantity</th>
                                                <th className="p-6 text-[10px] font-black uppercase tracking-widest">Log Time</th>
                                                <th className="p-6 text-[10px] font-black uppercase tracking-widest text-right">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {orders.map(o => (
                                                <tr key={o.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="p-6 font-mono font-bold text-blue-600">TXN_{o.id.toString().padStart(4, '0')}</td>
                                                    <td className="p-6 font-black text-slate-800">{o.productName}</td>
                                                    <td className="p-6 font-bold">{o.quantity} EA</td>
                                                    <td className="p-6 text-gray-400 text-sm font-medium">{o.time}</td>
                                                    <td className="p-6 text-right"><span className="status-badge badge-safe">SUCCESS</span></td>
                                                </tr>
                                            ))}
                                            {orders.length === 0 && <tr><td colSpan="5" className="p-20 text-center text-gray-300 font-bold italic">처리된 트랜잭션이 없습니다.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="flex w-full min-h-screen">
                    {/* Bug Toast */}
                    {activeBug && (
                        <div className="bug-toast">
                            <div className="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 font-mono font-bold text-xs border border-white/10">
                                <span className="text-orange-400">⚡</span> bugid : {activeBug}
                            </div>
                        </div>
                    )}

                    {/* Sidebar */}
                    <aside className="sidebar flex flex-col py-10 shadow-2xl">
                        <div className="flex items-center gap-3 mb-16 px-10">
                            <div className="w-12 h-12 bg-orange-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-xl shadow-orange-900/40">S</div>
                            <h2 className="text-2xl font-black tracking-tighter italic">StockLink</h2>
                        </div>
                        <nav className="flex-1 space-y-2">
                            <div onClick={() => setView('dashboard')} className={`nav-link ${view === 'dashboard' ? 'active' : ''}`}>📊 <span>컨트롤 센터</span></div>
                            <div onClick={() => setView('products')} className={`nav-link ${view === 'products' ? 'active' : ''}`}>📦 <span>재고 마스터</span></div>
                            <div onClick={() => setView('orders')} className={`nav-link ${view === 'orders' ? 'active' : ''}`}>📜 <span>트랜잭션 기록</span></div>
                        </nav>
                        <div className="mt-auto px-10 py-8 border-t border-slate-800 text-[9px] text-slate-500 font-black uppercase tracking-[0.2em]">
                            Enterprise Node site053
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="main-content flex-1">
                        {renderContent()}
                        <footer className="mt-20 py-12 border-t border-slate-100 text-center text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">
                            © 2026 StockLink Advanced Logic Simulation
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
