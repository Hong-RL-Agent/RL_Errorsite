server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:9088;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9088;
    proxy_set_header X-Forwarded-Host localhost:9088;
    proxy_buffering off;
    proxy_cache off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
