events { worker_connections 1024; }

http {
    upstream frontend { server frontend-9045:9045; }
    upstream backend { server backend-9045:8080; }

    server {
        listen 80;
        
        # 프론트엔드 연결
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # 백엔드 API 연결
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 9045-Network-3: API Rate Limit 부재 결함 포함
        }
    }
}